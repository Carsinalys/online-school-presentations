<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#eafcf6"><title>Диагностический тренажёр «Алкены» · М.И.Р.</title><link rel="stylesheet" href="data/style.css"><style id="mirBootStyle">body{visibility:hidden}</style></head>
<body><div id="app"><div class="logo-watermark" aria-hidden="true"><img alt="" src="data/logo-11e4ec90e7e3.webp"></div>
<header class="site-header"><div class="brand"><div class="brand-mark" aria-hidden="true">⚗</div><div><div class="brand-pre">ОБРАЗОВАТЕЛЬНЫЙ ПОРТАЛ · М.И.Р.</div><div class="brand-name">Диагностика · Алкены</div></div></div><div class="site-actions"><span class="header-status" id="headerStatus"></span><a class="portal" href="https://portalmir.by/" target="_blank" rel="noopener noreferrer">Портал М.И.Р.</a></div></header>
<main id="screen" class="app-main" aria-live="polite"></main></div><script>
(function(){
 const reveal=()=>document.getElementById('mirBootStyle')?.remove();
 function message(text){document.body.replaceChildren();const el=document.createElement('div');el.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eaf3f5;padding:24px;text-align:center;font:20px/1.5 Segoe UI,Arial,sans-serif;color:#153450;z-index:2147483647';el.textContent=text;document.body.append(el);reveal();}
 if(!['http:','https:'].includes(location.protocol)){message('Тренажёр работает только на сайте. Откройте его через интернет.');return;}
 const base=new URL('./data/',location.href);
 async function start(){
  const r=await fetch(new URL('questions.json',base),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  globalThis.__mirQuestionBank=await r.json();
  await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=new URL('engine.js',base).href;script.onload=resolve;script.onerror=reject;document.body.append(script);});
  delete globalThis.__mirQuestionBank;reveal();
 }
 start().catch(e=>{console.error(e);message('Не удалось загрузить тренажёр. Проверьте подключение к интернету и обновите страницу.');});
})();
</script></body></html>
