<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Химические свойства бензола — М.И.Р.</title><link rel="stylesheet" href="data/style.css"></head><body><div id="viewport"><div id="stage"><div class="watermark" aria-hidden="true"><img id="mirLogo" alt="" src="data/logo.webp"></div><header class="top"><div class="brand"><div class="brand-icon">⚗</div><div><div class="brand-sub">УЧЕБНЫЙ ТРЕНАЖЁР · М.И.Р.</div><div class="brand-title">Химические свойства бензола</div></div></div><div class="righttop"><a class="portal" href="https://portalmir.by/" target="_blank" rel="noopener noreferrer" title="Открыть образовательный портал М.И.Р.">🌐 Портал М.И.Р. · portalmir.by</a><button class="button soft" id="home" type="button">⌂ Главная</button><button class="button yellow" id="ref" type="button">▤ Справочник</button></div></header><main id="screen" class="main"><section class="hero"><p>Загрузка тренажёра…</p></section></main><aside id="reference" class="ref-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="refHeading"><div class="ref-title" id="refHeading">Справочник реакций <button class="button primary" id="closeRef" type="button">✕ Закрыть</button></div><input id="search" class="ref-search" type="search" placeholder="Поиск реакции или вещества"><div id="refsList" class="refs-list"></div></aside></div></div><div class="orientation">↻ Поверни телефон горизонтально</div><script>
(function(){
  function message(text){const v=document.getElementById('viewport');v.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eaf3f5;padding:24px;text-align:center';v.replaceChildren();const p=document.createElement('p');p.style.cssText='font:20px/1.5 Segoe UI,Arial,sans-serif;color:#153450;max-width:760px';p.textContent=text;v.append(p);const o=document.querySelector('.orientation');if(o)o.remove();}
  if(!['http:','https:'].includes(location.protocol)){message('Тренажёр работает только на сайте. Откройте его через интернет.');return;}
  const base=new URL('./data/',location.href);
  async function load(name){const r=await fetch(new URL(name,base),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
  Promise.all([load('questions.json'),load('reference.json'),import(new URL('engine.js',base).href)]).then(([questions,refs,engine])=>engine.init(questions,refs)).catch(e=>{console.error(e);message('Не удалось загрузить тренажёр. Проверьте подключение к интернету и обновите страницу.');});
})();
</script></body></html>
