<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>М.И.Р. — Алканы</title><style>body{margin:0;background:#edf5f7;color:#23445a;font:20px system-ui}#app{max-width:1100px;margin:auto;padding:28px}button{font:inherit;cursor:pointer}</style><main id="app">Загрузка тренажёра…</main><script>
(async()=>{const app=document.querySelector('#app');try{if(!['https:','http:'].includes(location.protocol))throw Error('Тренажёр работает только на сайте. Откройте его через интернет.');const base=new URL('./data/',location.href);const cfg=await fetch(new URL('settings.json',base),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Настройки недоступны');return r.json()});if(cfg.allowedHosts.length&&!cfg.allowedHosts.includes(location.hostname))throw Error('Этот адрес не разрешён для запуска.');if(cfg.allowedParentOrigins.length){let origin='';try{origin=new URL(document.referrer).origin}catch{}if(window.top===window||!cfg.allowedParentOrigins.includes(origin))throw Error('Откройте тренажёр внутри сайта М.И.Р.');}const css=document.createElement('link');css.rel='stylesheet';css.href=new URL('style.css',base);document.head.append(css);const engine=await import(new URL('engine.js',base));await engine.start(app,base)}catch(e){app.textContent=e.message||'Не удалось загрузить тренажёр. Проверьте подключение.'}})();</script></html>
