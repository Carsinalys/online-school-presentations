<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>М.И.Р. — Митохондрия</title><style>
:root{color-scheme:light;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#405966;background:#f7fafb}*{box-sizing:border-box}body{margin:0}.mir{max-width:1400px;margin:auto;background:#f9fcfd;border:1px solid #d3e0e5;border-radius:15px;overflow:hidden}.toolbar,.row{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.toolbar{padding:10px}.stage{position:relative;background:radial-gradient(ellipse at 45% 35%,#fff,#dce7ee);aspect-ratio:16/9;overflow:hidden}.stage.dark{background:radial-gradient(ellipse,#607683,#24333e)} .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.stage.failed .status{inset:auto 8% 8%;background:#f9fcfded;padding:8px;border-radius:8px;color:#405966;font-size:12px}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.brand{position:absolute;top:12px;left:14px;letter-spacing:.12em;font-size:11px;color:#7793a2;pointer-events:none}.dark .brand,.dark .scale,.dark .partlabel{color:#cbdce6}.status{position:absolute;inset:43% 8% auto;text-align:center;pointer-events:none;font-size:14px;overflow-wrap:anywhere}.partlabel{position:absolute;right:3%;top:13%;font-size:12px;pointer-events:none;max-width:32%;text-align:center}.scale{position:absolute;bottom:13px;left:16px;font-size:10px;text-align:center;color:#6c8797;pointer-events:none}.scale i{display:block;border:solid currentColor;border-width:0 1px 2px;height:6px;margin-bottom:3px}.controls{padding:12px 16px 16px}.group{border-top:1px solid #dce6eb;padding-top:12px;margin-top:12px}.heading{text-align:center;font-size:13px;font-weight:650;margin-bottom:8px}.slidergrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.slider label{display:flex;justify-content:space-between;font-size:12px;gap:5px}.slider input{width:100%;margin:5px 0 0;accent-color:#638e9e}button{font:inherit;font-size:13px;font-weight:500;padding:8px 12px;min-height:36px;color:#456273;background:#fff;border:1px solid #c3d4dc;border-radius:8px;cursor:pointer;touch-action:manipulation}button.active,button[aria-pressed=true]{background:#527e91;color:#fff;border-color:#527e91}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #28769e;outline-offset:2px}.check{font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px}input[type=checkbox]{accent-color:#628c9e;width:16px;height:16px}.hint,.foot{font-size:11px;text-align:center;color:#6c8390;margin-top:10px}.foot{line-height:1.4}.legend{font-size:11px;gap:12px;margin-top:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.secondary{margin-top:9px}.mag{max-width:320px;margin:9px auto 0}.hidden,[hidden]{display:none!important}@media(max-width:520px){.mir{border-radius:9px}.toolbar,.controls{padding:8px}.stage{aspect-ratio:16/9}.slidergrid{gap:8px}.slider label{font-size:11px}button{font-size:12px;padding:7px 9px;min-height:36px}.brand{font-size:9px;top:7px;left:8px}.row{gap:5px}.check{font-size:12px}.partlabel{font-size:10px}.scale{left:8px;bottom:7px}.legend{gap:6px}.foot{font-size:10px}}
</style></head><body><main class="mir" aria-label="Интерактивная модель митохондрии">
<div class="toolbar" aria-label="Вид модели"><button data-view="whole">Целая</button><button data-view="cut" class="active">Разрез</button><button data-view="inner">Открытые кристы</button></div>
<div class="stage" id="stage"><canvas id="cv" aria-label="Вращаемая трёхмерная митохондрия"></canvas><img class="poster" id="poster" src="preview.png" alt="Предварительный вид митохондрии в разрезе"><div class="brand">М.И.Р. • MITOCHONDRIA</div><div class="status" id="status" role="status">Загрузка 3D-модели…</div><div class="partlabel" id="part"></div><div class="scale" id="scale"><i id="bar"></i>200 нм</div></div>
<div class="controls"><div class="row"><label class="check"><input type="checkbox" id="matrix" checked>Матрикс</label><label class="check"><input type="checkbox" id="dna" checked>ДНК</label><label class="check"><input type="checkbox" id="rna" checked>РНК</label><label class="check"><input type="checkbox" id="ribo" checked>Рибосомы</label></div>
<div class="slidergrid"><div class="slider"><label for="density">Насыщенность матрикса <span id="dv">55%</span></label><input id="density" type="range" min="0" max="100" value="55"></div><div class="slider"><label for="gel">Оптические неоднородности <span id="gv">60%</span></label><input id="gel" type="range" min="0" max="100" value="60"></div></div>
<div class="group"><div class="heading">Извлечь для изучения</div><div class="row"><button data-part="dna" disabled>ДНК</button><button data-part="rna" disabled>РНК</button><button data-part="ribo" disabled>Рибосома</button></div><div id="selectedControls" hidden><div class="row secondary"><button id="alone">Рассмотреть отдельно</button><button id="return">Вернуть на место</button></div><div class="row secondary" id="dnaOptions" hidden><button id="pack" class="active">Свернуть</button><button id="ring">Распаковать в кольцо</button></div><div class="slider mag"><label for="mag">Увеличение структуры <span id="mv">100%</span></label><input id="mag" type="range" min="50" max="200" value="100"></div></div><div id="hint" class="hint">Выберите одну структуру для извлечения.</div></div>
<div class="group row"><button id="minus" aria-label="Уменьшить">−</button><button id="plus" aria-label="Увеличить">+</button><button id="front">Вид на срез</button><button id="spin">▶ Вращение</button><button id="reset">Исходный вид</button><label class="check"><input id="dark" type="checkbox">Тёмный фон</label></div>
<div class="row legend"><span><i class="dot" style="background:#e8c0a4"></i>Наружная мембрана</span><span><i class="dot" style="background:#bf735b"></i>Внутренняя мембрана</span><span><i class="dot" style="background:#8ecddd"></i>Матрикс</span></div><div class="foot">Учебная модель • условная длина 2 мкм • молекулярные структуры схематичны, при извлечении увеличены.</div></div></main>
<script src="model.js"></script><script src="viewer.js"></script></body></html>
