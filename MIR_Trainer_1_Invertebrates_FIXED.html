html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:grid;place-items:center;background:#d7eef8;font-family:Georgia,&quot;Century Schoolbook&quot;,serif;color:#183f59}
.slide{position:relative;aspect-ratio:16/9;width:min(100vw,177.77778vh);max-height:100vh;overflow:hidden;
 background:radial-gradient(circle at 5% 10%,#f6fcff 0%,transparent 40%),linear-gradient(135deg,#d9effa,#bce3f3 74%,#d9effb)}
.slide::before{content:&quot;&quot;;position:absolute;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:18px 18px}
.header{position:absolute;top:4.5%;left:5%;right:5%;height:10%;display:flex;align-items:center;justify-content:center;z-index:4}
h1{font-weight:700;font-size:clamp(20px,2.9vw,46px);line-height:1.08;margin:0;text-align:center;color:#144d6d}
.watermark-link{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:44%;display:block;z-index:3;opacity:.18;filter:blur(.9px)}
.watermark-link img{width:100%;height:auto;display:block;object-fit:contain}
.columns{position:absolute;left:4.3%;right:4.3%;top:18%;bottom:18.1%;display:grid;grid-template-columns:1fr 1fr;gap:3.2%;min-height:0;z-index:2}
.panel{min-height:0;height:100%;border:1px solid rgba(95,168,196,.5);border-radius:2.1cqw;background:rgba(255,255,255,.78);box-shadow:0 8px 24px rgba(30,99,135,.11);padding:2.2% 3% 2.6%;display:grid;grid-template-rows:11% 1fr;gap:1.5%}
.panel-title{font-size:clamp(15px,1.6vw,26px);font-weight:700;text-align:center;color:#1c6084;align-self:center}
.pairs{min-height:0;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:1.65%}
.pair{display:grid;grid-template-columns:42% 7% 1fr;align-items:center;padding:0 3%;min-height:0;border-radius:1.1cqw;border:1px solid #cde6f0;background:linear-gradient(180deg,#fff,#edf9ff);font-size:clamp(12px,1.55vw,24px);line-height:1.08}
.word{font-weight:700;color:#116b92}
.dash{color:#729caf;text-align:center}
.category{font-weight:700;color:#183e58}
.study-note{position:absolute;left:4.3%;right:4.3%;bottom:8.6%;height:8%;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4;border-radius:14px;border:1px solid #a9d6e7;background:rgba(255,255,255,.91);padding:6px 23px;color:#225873;font-size:clamp(12px,1.25vw,19px);line-height:1.25;font-weight:600}
.bottom{position:absolute;left:3.6%;right:3.6%;bottom:2.2%;height:6%;display:flex;align-items:center;justify-content:space-between;gap:20px;z-index:4}
.hint{font-size:clamp(10px,.98vw,15px);color:#366b86;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portal{font-size:clamp(11px,1.05vw,16px);font-weight:700;color:#0d597d;text-decoration:none;background:rgba(255,255,255,.85);padding:7px 16px;border:1px solid #a9d6e7;border-radius:999px;box-shadow:0 2px 10px rgba(30,99,135,.08)}

@keyframes pop{from{opacity:.1;transform:scale(.90)}to{opacity:1;transform:scale(1)}}
.section{display:grid;grid-template-rows:32px 1fr;gap:8px;min-height:0}
.section-title{color:#245a76;font-size:22px;font-weight:700;padding-left:4px;display:flex;align-items:center}
.options{display:grid;gap:10px;min-height:0}
.options.kingdom{grid-template-columns:1fr}
.options.subtypes{grid-template-columns:1fr}
.options.types{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(50px,1fr)}
.options.classes{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(52px,1fr)}
.option{font-family:inherit;border:1px solid #c2e4f0;border-radius:12px;background:linear-gradient(#fff,#eff9fd);font-size:18px;font-weight:700;color:#1b5778;padding:10px 8px;line-height:1.14;cursor:pointer;min-height:50px;box-shadow:0 1px 2px #d7eaf0;width:100%}
.options.kingdom .option{min-height:44px;font-size:21px}
.option:hover{background:#dff3fb}
.option.selected{background:#bce8f6;border-color:#278eaf;color:#084f71;box-shadow:inset 0 0 0 1px #5eafd0}
.option.success{background:#b9f2cc;border:2px solid #16944a;color:#11572b;box-shadow:0 0 0 2px rgba(34,163,81,.15)}
.option.incorrect{background:#ffd1dd;border:2px solid #d82059;color:#8b1539;box-shadow:0 0 0 2px rgba(216,32,89,.13)}
.watermark{position:absolute;left:52%;top:51%;transform:translate(-50%,-50%);width:840px;opacity:.18;filter:blur(1px);z-index:2;pointer-events:none}

/* Исправленная компоновка рабочего слайда. Все 11 классов строго внутри панели. */
#demo{top:22px;bottom:22px;left:38px;right:38px;grid-template-columns:318px minmax(0,1fr);gap:18px}
.right-panel{padding:12px 17px 14px;grid-template-rows:50px 67px 181px 68px minmax(0,1fr);gap:8px;overflow:hidden}
.topline{min-width:0;gap:10px}
.panel-label{font-size:27px;white-space:nowrap}
.portal{font-size:16px;padding:9px 12px}
.section{grid-template-rows:25px minmax(0,1fr);gap:5px;min-height:0}
.section-title{font-size:21px}
.options{min-height:0;gap:7px}
.options.kingdom{grid-template-columns:1fr}
.options.subtypes{grid-template-columns:1fr}
.options.types{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));grid-auto-rows:0}
.options.classes{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));grid-auto-rows:0}
.option{min-height:0;height:100%;padding:3px 6px;font-size:15.8px;line-height:1.05;touch-action:manipulation}
.options.kingdom .option{min-height:0;height:100%;font-size:20px}
.animal-panel{padding:16px}
.pic{height:322px}
.watermark{left:50%;top:50%;width:700px;z-index:9;opacity:.34;filter:blur(.35px);pointer-events:none}
#feedback{position:absolute;top:13px;right:15px;z-index:10;max-width:390px;font-size:17px;min-height:48px}

.action-buttons{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:12px}
#next{width:100%;min-height:54px;border:0;border-radius:15px;background:linear-gradient(115deg,#29a474,#168259);color:#fff;font:700 22px Georgia,&#x27;Century Schoolbook&#x27;,serif;cursor:pointer;box-shadow:0 4px 14px rgba(25,120,88,.19)}
#next:hover:not(:disabled){background:linear-gradient(115deg,#24b37b,#08774c)}
#next:disabled{cursor:default;background:#b5cbd2;box-shadow:none;opacity:.72}
#next:focus-visible,#check:focus-visible,.option:focus-visible{outline:4px solid #feaa48;outline-offset:2px}

/* Одинаковая ширина единичных кнопок; звание и ответ стоят на одной линии. */
.right-panel .section.compact-rank{
  display:grid;
  grid-template-columns:100px 255px;
  grid-template-rows:minmax(0,1fr);
  column-gap:14px;
  align-items:center;
  justify-content:start;
}
.right-panel .section.compact-rank .section-title{
  padding:0;
  font-size:21px;
  text-align:left;
}
.right-panel .section.compact-rank .options{
  width:255px;
  height:52px;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  align-items:stretch;
}
.right-panel .section.compact-rank .option{
  width:100%; height:52px; min-height:52px;
  font-size:17px; padding:7px 10px;
}
#progress{font-size:14px;font-weight:700;color:#437894;margin-top:4px;text-align:center;min-height:20px}

/* Итоговый экран рефлексии на полный слайд, без изменения учебных карточек */
#reflection{display:none;position:absolute;inset:24px 39px;z-index:12;border:1px solid #91c8dd;border-radius:25px;
 background:linear-gradient(145deg,#ffffffed,#e9f7fdf2);box-shadow:0 12px 38px #366c872c;padding:33px 48px 30px;
 flex-direction:column;align-items:center;text-align:center;color:#174a69}
#reflection.visible{display:flex}
.ref-kicker{font:bold 16px Georgia,serif;letter-spacing:.09em;color:#4082a4}
.ref-heading{font:bold 46px Georgia,serif;line-height:1.12;margin:15px 0 12px;color:#19678c}
.ref-subtitle{font:21px Georgia,serif;line-height:1.35;max-width:900px;margin:0 auto;color:#466b7d}
.ref-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%;margin-top:29px}
.ref-card{padding:22px 12px 20px;border-radius:20px;border:1px solid #bddde8;background:#fff;min-height:158px}
.ref-card .num{font:bold 49px Georgia,serif;line-height:1;color:#156b93}
.ref-card .desc{font:bold 19px Georgia,serif;line-height:1.28;margin-top:14px;color:#41657b}
.ref-card.green .num{color:#158756}
.ref-card.orange .num{color:#b36e17}
.ref-card.blue .num{color:#18769d}
.ref-footnote{font:17px Georgia,serif;color:#507287;line-height:1.3;margin:18px 0 0}
.ref-actions{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:auto;width:100%}
.ref-button{min-height:66px;min-width:282px;padding:12px 24px;border:0;border-radius:15px;color:#fff;font:bold 23px Georgia,serif;cursor:pointer;box-shadow:0 6px 16px #214c6a23}
#ref-repeat{background:linear-gradient(110deg,#1887b5,#146c98)}
#ref-mistakes{background:linear-gradient(110deg,#22a977,#168259)}
#ref-mistakes[hidden]{display:none}
.ref-button:focus-visible{outline:4px solid #e6a13e;outline-offset:3px}

function shuffle(indices){
  const result=[...indices];
  for(let i=result.length-1;i&gt;0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }

}

  document.querySelector(&#x27;#ref-note&#x27;).textContent=retryIndices.length

    :&#x27;Отличная работа! Для закрепления знаний попробуй пройти все карточки в другом порядке.&#x27;;
  document.querySelector(&#x27;#ref-mistakes&#x27;).hidden=retryIndices.length===0;
  document.querySelector(&#x27;#reflection&#x27;).classList.add(&#x27;visible&#x27;);
  checkButton.disabled=true;
  nextButton.disabled=true;
}
let pendingReview=[];
function startReview(){
  if(pendingReview.length===0)return;
  reviewQueue=shuffle(pendingReview);
  reviewRecords=[];
  reviewPosition=0;
  mode=&#x27;review&#x27;;
  document.querySelector(&#x27;#reflection&#x27;).classList.remove(&#x27;visible&#x27;);
  showAnimal(reviewQueue[0]);
}
function restartAll(){
  // Полная новая тренировка: Fisher–Yates перемешивает все 18 карточек заново.
  // Дополнительно избегаем случайного повтора прежнего порядка.
  const previous=randomizedOrder.join(&#x27;,&#x27;);
  randomizedOrder=shuffle(ITEMS.map((_,i)=&gt;i));
  if(ITEMS.length&gt;1 &amp;&amp; randomizedOrder.join(&#x27;,&#x27;)===previous){
    [randomizedOrder[0],randomizedOrder[1]]=[randomizedOrder[1],randomizedOrder[0]];
  }
  originalRecords.length=0;
  reviewQueue=[];
  reviewRecords=[];
  reviewPosition=0;
  pendingReview=[];
  mode=&#x27;training&#x27;;
  document.querySelector(&#x27;#reflection&#x27;).classList.remove(&#x27;visible&#x27;);
  showAnimal(randomizedOrder[0]);
}
document.querySelector(&#x27;#ref-mistakes&#x27;).addEventListener(&#x27;click&#x27;,startReview);
document.querySelector(&#x27;#ref-repeat&#x27;).addEventListener(&#x27;click&#x27;,restartAll);
document.querySelectorAll(&#x27;button.option&#x27;).forEach(button=&gt;{
  button.addEventListener(&#x27;click&#x27;,()=&gt;{
    if(mode===&#x27;summary&#x27;)return;
    const group=button.dataset.group;
    const deselect=button.classList.contains(&#x27;selected&#x27;);
    document.querySelectorAll(&#x27;button.option[data-group=&quot;&#x27;+group+&#x27;&quot;]&#x27;).forEach(b=&gt;{
      b.classList.remove(&#x27;selected&#x27;,&#x27;success&#x27;,&#x27;incorrect&#x27;);b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);
    });
    if(deselect){delete selected[group];}
    else{button.classList.add(&#x27;selected&#x27;);button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);selected[group]=button.textContent.trim();}
    verified=false;nextButton.disabled=true;clearFeedback();
  });
});
checkButton.addEventListener(&#x27;click&#x27;,()=&gt;{
  if(mode===&#x27;summary&#x27;)return;
  // Ракообразные — подтип; у остальных изучаемых животных подтип не указан.
  const correct=ITEMS[currentIndex].correct;
  const isCrustacean=correct.subtype===&#x27;Ракообразные&#x27;;
  const groups=[&#x27;kingdom&#x27;,&#x27;type&#x27;,&#x27;subtype&#x27;,&#x27;class&#x27;];
  let missing=false,incorrect=false;
  for(const group of groups){
    const chosen=document.querySelector(&#x27;button.option.selected[data-group=&quot;&#x27;+group+&#x27;&quot;]&#x27;);
    const expected=group===&#x27;subtype&#x27;?(correct.subtype||null):group===&#x27;class&#x27;&amp;&amp;isCrustacean?null:(correct[group]||null);
    if(!chosen){if(expected!==null)missing=true;continue;}
    chosen.classList.remove(&#x27;success&#x27;,&#x27;incorrect&#x27;);
    if(selected[group]===expected)chosen.classList.add(&#x27;success&#x27;);
    else{chosen.classList.add(&#x27;incorrect&#x27;);incorrect=true;currentMistake=true;}
  }
  if(missing){currentMistake=true;showFeedback(&#x27;Заполни нужные категории&#x27;,&#x27;warn&#x27;);return;}
  if(incorrect){showFeedback(&#x27;Неверно! Исправь красные ответы&#x27;,&#x27;bad&#x27;);return;}
  verified=true;nextButton.disabled=false;
  showFeedback(&#x27;Верно! Систематика определена&#x27;,&#x27;good&#x27;);
});
nextButton.addEventListener(&#x27;click&#x27;,()=&gt;{
  if(mode===&#x27;summary&#x27;){startReview();return;}
  if(!verified)return;
  const entry={index:currentIndex,animal:ITEMS[currentIndex].name,hadError:currentMistake};
  if(mode===&#x27;review&#x27;){
    reviewRecords.push(entry);
    reviewPosition++;
    if(reviewPosition&gt;=reviewQueue.length){finishRound();return;}
    showAnimal(reviewQueue[reviewPosition]);
  }else{
    originalRecords.push(entry);
    if(originalRecords.length&gt;=ITEMS.length){finishRound();return;}
    showAnimal(randomizedOrder[originalRecords.length]);
  }
});
showAnimal(randomizedOrder[0]);
