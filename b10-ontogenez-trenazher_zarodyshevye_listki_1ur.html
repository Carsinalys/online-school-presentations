<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Зародышевые листки — тренажёр</title><style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#dfe9ec;font-family:'Trebuchet MS',Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#fff 0%,#f8fbfc 55%,#eaf5f8 100%);box-shadow:0 28px 90px #42627334;border:2px solid #cbdfe4;border-radius:25px}
#top{position:absolute;top:35px;width:100%;text-align:center;color:#23465b;pointer-events:none}#top .small{font-size:26px;letter-spacing:.13em;text-transform:uppercase;color:#63889b;font-weight:800}#top .question{font-size:43px;font-weight:800;margin-top:10px}#term{font-size:50px;color:#275b7a;font-weight:900;margin-top:3px}#progress{position:absolute;right:35px;top:32px;z-index:8;color:#587386;font-size:22px;text-align:right;font-weight:700}#progress small{font-size:18px;font-weight:500}
#msg{position:absolute;top:211px;left:475px;width:650px;z-index:8;text-align:center;font-size:29px;font-weight:900;min-height:48px;color:transparent;pointer-events:none}#msg.good{color:#278355}#msg.bad{color:#ba5664}#msg.show{color:#275b7a}
#illustration{position:absolute;left:555px;top:255px;width:445px;height:573px;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 12px 10px #57738920);user-select:none;pointer-events:none}
svg#leaders{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:visible;pointer-events:none}#leaders path{fill:none;stroke:#567d90;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}#leaders circle{fill:#fff;stroke:#567d90;stroke-width:5}
.answer{position:absolute;z-index:3;height:86px;min-width:330px;border-radius:25px;border:4px solid #79a5b7;box-shadow:0 10px 20px #3f738527;background:#f5fdff;color:#23485b;font-size:34px;font-weight:900;cursor:pointer;transition:filter .15s,background .15s,transform .15s;touch-action:manipulation} .answer:active{transform:scale(.97)}.answer:hover:not(:disabled){filter:brightness(.98)}.answer:disabled{cursor:default}#ecto{left:92px;top:345px;border-color:#69c8c5;background:#e8fcf8}#meso{left:1158px;top:465px;border-color:#f080a0;background:#fff1f5}#endo{left:92px;top:650px;border-color:#d6ad89;background:#fff7ed}
.answer.selected-good{background:#d9f5de;border-color:#39a468;color:#165d3a;box-shadow:0 0 0 8px #76ce8a4f}.answer.selected-bad{background:#ffe1e5;border-color:#dc6f77;color:#9c3346}.answer.revealed{box-shadow:0 0 0 9px #6dcc984f}
.label{position:absolute;font-size:24px;font-weight:800;color:#55788d;background:#ffffffd9;padding:5px 11px;border-radius:10px;z-index:2}#tube{left:1047px;top:290px}#chord{left:1080px;top:365px}#intestine{left:1055px;top:743px}#bottomhint{position:absolute;bottom:23px;left:0;width:100%;font-size:18px;text-align:center;color:#7b98a9;letter-spacing:.05em}
#finish{display:none;position:absolute;inset:0;z-index:20;background:linear-gradient(150deg,#eefafb,#f8fcff);align-items:center;justify-content:center;text-align:center;color:#264a62}#finish .paper{width:1000px;padding:60px 55px;background:white;border-radius:34px;border:2px solid #d4e5ef;box-shadow:0 20px 60px #537f9a27}#finish h1{font-size:61px;margin:0 0 20px}#finish .result{display:flex;gap:22px;margin:38px 0 25px}#finish .metric{flex:1;padding:23px 12px;background:#f4fafc;border-radius:18px}#finish .metric strong{display:block;font-size:62px;color:#286087}#finish .metric span{font-size:23px}#finish .percent{font-size:39px;font-weight:900;margin:10px 0 25px}#again{font-size:29px;border:0;background:#4a9cae;color:white;border-radius:19px;padding:20px 55px;font-weight:800;cursor:pointer}

/* Исправления компоновки: заметные задания, не перекрывающие схему фирменные знаки */
#top .question{color:#29465a;font-size:41px}
#term{display:inline-block;max-width:1060px;min-width:470px;margin-top:5px;padding:7px 27px 10px;color:#a51a5c;background:#fff0a6;border:3px solid #edbd35;border-radius:20px;box-shadow:0 5px 0 #e0a84255,0 8px 25px #9f791f16;font-size:52px;line-height:1.16;letter-spacing:.015em}
#msg{top:217px;left:400px;width:800px;min-height:50px;font-size:29px;color:#fff;white-space:nowrap;letter-spacing:.01em;transition:opacity .15s}
#msg.good,#msg.bad,#msg.show{display:block;color:#fff;padding:10px 17px;border-radius:14px;box-shadow:0 7px 19px #21415433}
#msg.good{background:#08884f;border:3px solid #086837}
#msg.bad{background:#bc2646;border:3px solid #901a39}
#msg.show{background:#174eac;border:3px solid #0b3381}
#msg:not(.good):not(.bad):not(.show){background:transparent;box-shadow:none;border:none;padding:0}
#bottomhint{display:none}
#branding{position:absolute;right:24px;bottom:22px;width:245px;height:125px;z-index:1;pointer-events:none;text-align:center}
#branding img{display:block;margin:auto;object-fit:contain}
#branding .emblem{width:218px;height:96px;opacity:.23}
#branding .site{width:206px;height:31px;opacity:.52;filter:drop-shadow(0 0 1px #10345e)}
#leaders path{stroke:#3f778f;stroke-width:8}
#leaders circle{stroke:#3f778f;stroke-width:5.5}
#finish .brand-in-result{display:block;max-width:220px;max-height:90px;object-fit:contain;opacity:.32;margin:15px auto -15px}

 const bank=[["нервная система", "ecto"], ["эпидермис кожи", "ecto"], ["волосы и ногти", "ecto"], ["органы чувств", "ecto"], ["молочные железы", "ecto"], ["мышечная ткань", "meso"], ["дерма кожи", "meso"], ["костная ткань", "meso"], ["сердце", "meso"], ["почки", "meso"], ["половые железы", "meso"], ["эпителий кишечника", "endo"], ["эпителий дыхательных путей", "endo"], ["эпителий печени", "endo"], ["эпителий поджелудочной железы", "endo"]];
 // Перемешиваем задания при каждом прохождении; не допускаем три ответа подряд из одного листка.
 function shuffledQuestions(){
   let arr=[];
   for(let trial=0;trial<150;trial++){
     arr=bank.slice();
     for(let j=arr.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[arr[j],arr[k]]=[arr[k],arr[j]];}
     if(arr.every((q,j)=>j<2 || !(q[1]===arr[j-1][1]&&q[1]===arr[j-2][1])))break;
   }
   return arr;
 }
 let data=shuffledQuestions();
 const names={ecto:'Эктодерма',meso:'Мезодерма',endo:'Энтодерма'};
 const stage=document.querySelector('#stage');
 function sizeStage(){const scale=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`scale(${scale})`;}
 addEventListener('resize',sizeStage);sizeStage();
 let i=0,tries=0,first=0,second=0,failed=0,locked=false;
 const buttons=[...document.querySelectorAll('.answer')];const msg=document.querySelector('#msg');
 function message(text,cls){msg.textContent=text;msg.className=cls;}
 function progress(){document.querySelector('#progress').innerHTML=`${i+1} / ${data.length}<br><small>С первого раза: ${first} · Со второго: ${second}</small>`;}
 function next(){i++;if(i>=data.length){end();return;} render();}
 function render(){tries=0;locked=false;document.querySelector('#term').textContent=data[i][0];message('','');buttons.forEach(b=>{b.disabled=false;b.className='answer'});progress();}
 function complete(){locked=true;buttons.forEach(b=>b.disabled=true)}
 function choose(b){if(locked||b.disabled)return;const answer=data[i][1];const selected=b.dataset.a;
   if(selected===answer){b.classList.add('selected-good');if(tries===0){first++;message('✓ Верно!   Нажми на слайд →','good')}else{second++;message('✓ Верно со второй попытки!   Нажми на слайд →','good')}progress();complete()}
   else if(tries===0){tries=1;b.classList.add('selected-bad');b.disabled=true;message('✕ Неверно! Попробуй ещё раз','bad')}
   else {failed++;b.classList.add('selected-bad');buttons.find(x=>x.dataset.a===answer).classList.add('selected-good','revealed');message('Правильный ответ: '+names[answer]+'   •   Нажми на слайд →','show');progress();complete()}
 }
 buttons.forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();choose(b)}));
 stage.addEventListener('click',e=>{if(!locked || e.target.closest('.answer') || e.target.closest('#finish'))return; next();});
 function end(){document.querySelector('#resFirst').textContent=first;document.querySelector('#resSecond').textContent=second;document.querySelector('#resWrong').textContent=failed;document.querySelector('#resPercent').textContent='Выполнено: '+Math.round((first+second)/data.length*100)+'%';document.querySelector('#finish').style.display='flex'}
 document.querySelector('#again').addEventListener('click',()=>{data=shuffledQuestions();i=0;tries=0;first=0;second=0;failed=0;document.querySelector('#finish').style.display='none';render()});render();
 </script></body></html>
