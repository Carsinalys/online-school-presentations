<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отсек 10 — Разрушенная диспетчерская</title><style>
*{box-sizing:border-box}body{margin:0;background:#071015;color:#eaf7ff;font-family:system-ui,'Segoe UI',Arial,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.5}
#game{--cyan:#83deff;position:relative;isolation:isolate;width:100%;max-width:1440px;aspect-ratio:16/9;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 76% 48%,#344553 0,#152632 38%,#060e15 79%);border:2px solid #496a7a;container-type:inline-size}
#scene{position:absolute;inset:0;width:100%;height:100%;opacity:.95;pointer-events:none}
.glow{position:absolute;z-index:1;pointer-events:none}.glow.a{left:52%;top:8%;width:38%;height:72%;background:radial-gradient(ellipse,#1b618052,transparent 69%)}.glow.b{right:0;top:0;width:20%;height:70%;background:radial-gradient(ellipse,#e43f2f29,transparent 70%)}
#fog{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#071018dd 0%,#07101844 46%,transparent 82%),linear-gradient(0deg,#061014c9,transparent 25%);z-index:2}
.gear{transform-box:fill-box;transform-origin:center;animation:rotate 18s linear infinite;animation-play-state:paused}.gear.r{animation-direction:reverse}.running .gear{animation-play-state:running}.running .gear.g2{animation-duration:10s}@keyframes rotate{to{transform:rotate(360deg)}}
.lamp{animation:flash 2.2s infinite}@keyframes flash{0%,65%,100%{opacity:.95}75%,89%{opacity:.35}}
#doorL,#doorR{transition:transform 1.8s ease}.won #doorL{transform:translateX(-77px)}.won #doorR{transform:translateX(77px)}
#screenUI{z-index:4;position:absolute;inset:0;display:flex;flex-direction:column;padding:1.3cqw 1.65cqw 1.2cqw;gap:.9cqw}
.top{display:flex;align-items:start;justify-content:space-between;gap:1cqw}
.title{background:#07151de8;border:1px solid #6cb3c7;border-radius:.85cqw;padding:.64cqw 1.14cqw;box-shadow:0 0 1.1cqw #0eaada28;min-width:0}
.title b{font-size:clamp(16px,2.1cqw,29px);letter-spacing:.01em}.title small{display:block;font-size:clamp(12px,1.04cqw,17px);color:#b0d2de;margin-top:.1cqw}
.huds{display:flex;align-items:center;gap:.6cqw}.meter{min-width:10.5cqw;padding:.52cqw .7cqw;background:#07161eed;border:1px solid #526e78;border-radius:.68cqw;font-size:clamp(11px,1.03cqw,16px);font-weight:700}
.meter strong{font-size:clamp(17px,1.8cqw,28px);margin-left:.25cqw}.meter.d strong{color:#ff9b72}.meter.r strong{color:#82ffbd}
.track{margin-top:.25cqw;height:.48cqw;min-height:3px;background:#172934;border-radius:1cqw;overflow:hidden}.fill{height:100%;width:20%;background:linear-gradient(90deg,#ff5c48,#ffbe74);transition:width .5s}.meter.r .fill{width:80%;background:linear-gradient(90deg,#2a9c69,#8fffc1)}
.toolbar{display:flex;gap:.38cqw}.tool{background:#092332ed;color:#d8f7ff;border:1px solid #5997a9;border-radius:.6cqw;padding:.55cqw .65cqw;font-size:clamp(11px,.92cqw,16px);font-weight:700}.tool:hover{background:#185066}
.main{flex:1;min-height:0;display:flex;justify-content:start;align-items:center}
.panel{position:relative;width:61%;max-height:100%;padding:1.2cqw 1.35cqw .95cqw;background:linear-gradient(135deg,#081922f2,#0b202be9);border:1px solid #74b8c9;border-radius:1.15cqw;box-shadow:0 12px 40px #0009,0 0 35px #14bce020;display:flex;flex-direction:column;gap:.68cqw;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:1cqw}.step{color:#ffce72;font-size:clamp(13px,1.18cqw,18px);font-weight:800}.headline{font-size:clamp(20px,2.0cqw,31px);font-weight:900;line-height:1.13;margin:0;color:#f2fbff}.question{font-size:clamp(16px,1.38cqw,23px);line-height:1.27;margin:0;color:#e4eff2}
.equation{font-size:clamp(19px,2.1cqw,32px);font-weight:800;color:#fff0b9;line-height:1.2;text-align:center;border:1px solid #8e805858;border-radius:.58cqw;padding:.46cqw;background:#221e1838}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.57cqw}
.pick{display:flex;align-items:center;justify-content:center;gap:.5cqw;min-height:3.35cqw;padding:.48cqw .8cqw;color:#f2fbff;font-size:clamp(17px,1.47cqw,24px);font-weight:800;background:linear-gradient(#173646,#0e2734);border:2px solid #53899b;border-radius:.65cqw;transition:.15s;line-height:1.17;min-width:0}
.pick:hover{border-color:#b0f6ff;background:#1e4656}.pick.active{border-color:#ffc871;background:linear-gradient(#594624,#352d1c);box-shadow:0 0 15px #f1c15844}.pick.ok{border-color:#6fffb9;background:#15533b}.pick.no{border-color:#ff9891;background:#572526}
.pair{display:grid;grid-template-columns:1fr 1.35fr;gap:.65cqw}.pair p{font-weight:800;font-size:clamp(13px,1.1cqw,18px);color:#c6eaf3;margin:.15cqw 0 .5cqw}.pairs{display:flex;flex-direction:column;gap:.55cqw}.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.15cqw;padding:.4cqw;background:#102c39;border:2px dashed #688d9d;border-radius:.6cqw;font-size:clamp(15px,1.26cqw,21px);color:#f0faff}.slot b{color:#fff0b9;font-size:clamp(16px,1.4cqw,22px)}.slot.has{border-style:solid;border-color:#ffc871}
.message{font-size:clamp(15px,1.2cqw,20px);line-height:1.25;min-height:2.4cqw;color:#b9e5f0;padding:.55cqw .68cqw;background:#0b2734;border-left:.28cqw solid #68cfea;border-radius:.38cqw;font-weight:650}
.message.ok{color:#b9ffdd;border-left-color:#3df6a0;background:#0e3d30}.message.no{color:#ffd0bd;border-left-color:#ff7264;background:#4b282b}
.actions{display:flex;align-items:center;gap:.65cqw;justify-content:space-between}.action{padding:.65cqw 1.1cqw;border-radius:.6cqw;background:#275e72;border:1px solid #8ddff1;color:white;font-weight:850;font-size:clamp(16px,1.28cqw,22px)}.action.primary{background:linear-gradient(#21a869,#0c6741);border-color:#8bffc2}.action:disabled{filter:grayscale(.75)}
.engine{position:absolute;z-index:4;bottom:12%;right:2.3%;width:32%;background:#07171be8;border:1px solid #648d9d;border-radius:.8cqw;padding:.7cqw .9cqw;box-shadow:0 0 1.2cqw #000a}.engine .etitle{font-size:clamp(13px,1.22cqw,19px);font-weight:800;color:#e9f8ff}.locks{display:flex;gap:.5cqw;margin-top:.45cqw}.lock{display:grid;place-items:center;flex:1;border-radius:.45cqw;background:#381c20;color:#ffb3a3;border:1px solid #d66d69;font-size:clamp(16px,1.5cqw,22px);font-weight:900;min-height:2.3cqw;transition:.4s}.lock.unlocked{background:#124b37;color:#97ffbd;border-color:#4ceba3}.foot{display:flex;align-items:center;justify-content:space-between;gap:1cqw}.steps{display:flex;gap:.37cqw}.cell{width:2.25cqw;height:2.25cqw;min-width:19px;min-height:19px;display:grid;place-items:center;border-radius:.45cqw;background:#152833;border:1px solid #536b79;color:#bad2dd;font-size:clamp(12px,1.2cqw,18px);font-weight:800}.cell.past{background:#15583f;border-color:#4fdca5}.cell.current{background:#8a6021;border-color:#ffe58f;color:#fff}.footnote{font-size:clamp(12px,1.13cqw,18px);font-weight:750;background:#0a1d26da;border:1px solid #53717a;border-radius:.45cqw;padding:.4cqw .65cqw}
#toast{display:none;position:absolute;z-index:15;top:50%;left:50%;transform:translate(-50%,-50%);width:min(78%,650px);background:#0c212bf7;border:2px solid #72c7dd;border-radius:18px;box-shadow:0 0 0 100vmax #0009;padding:24px;text-align:center}
#toast.show{display:block}#toast h3{margin:0 0 8px;color:#ffdc91;font-size:clamp(22px,2.2cqw,34px)}#toast p{font-size:clamp(17px,1.45cqw,23px);line-height:1.35;margin:0 0 18px}
#toast button{padding:11px 26px;background:#1d7080;color:white;border:1px solid #9ce1ff;border-radius:10px;font-size:19px;font-weight:800}
@media(max-width:820px){#screenUI{padding:1.1cqw;gap:.3cqw}.huds{gap:.35cqw}.toolbar{gap:.2cqw}.title{padding:.3cqw .6cqw}.meter{min-width:8cqw;padding:.3cqw .4cqw}.tool{padding:.3cqw .45cqw}.panel{width:66%;padding:1cqw}.question{font-size:clamp(14px,1.55cqw,19px)}.pick{font-size:clamp(14px,1.5cqw,20px);min-height:3cqw;padding:.35cqw}.headline{font-size:clamp(17px,2cqw,26px)}.message{font-size:clamp(13px,1.3cqw,18px)}.engine{width:29%}.footnote{display:none}}
@media(max-width:570px){#game{aspect-ratio:16/10}.toolbar .tool{font-size:11px}.panel{width:73%}.engine{width:25%;right:1%;bottom:14%}.engine .etitle{font-size:10px}.lock{min-height:1.8cqw;font-size:12px}.title small{display:none}.question{font-size:13px}.pick{font-size:13px}.equation{font-size:15px}.message{font-size:12px}.action{font-size:12px}.huds{flex-wrap:wrap;justify-content:flex-end}}

<script>
(()=>{const root=document.querySelector('#game');
const $=id=>root.querySelector('#'+id);
const tasks=[
{title:'Кто принимает электроны?',question:'Первый механизм остановлен. Определи окислитель, чтобы разблокировать силовой переключатель.',eq:'Cl₂ + 2KBr = 2KCl + Br₂',type:'single',items:['Cl₂','KBr','KCl','Br₂'],answer:['Cl₂'],hint:'Окислитель принимает электроны. Найди вещество, в котором хлор переходит из степени окисления 0 в −1.',ok:'Верно! Хлор Cl₂ — окислитель. Первый силовой переключатель включён.'},
{title:'Кто отдаёт электроны?',question:'Для запуска второй зубчатой передачи найди восстановитель в реакции с соляной кислотой.',eq:'Zn + 2HCl = ZnCl₂ + H₂',type:'single',items:['Zn','HCl','ZnCl₂','H₂'],answer:['Zn'],hint:'Восстановитель отдаёт электроны. Обрати внимание, что происходит с цинком при образовании ZnCl₂.',ok:'Правильно! Цинк отдаёт электроны и выступает восстановителем. Вторая передача заработала.'},
{title:'Сбой степеней окисления!',question:'На металлическом диске сбились значения. Какова степень окисления хлора в хлориде калия KCl?',eq:'KCl → степень окисления Cl = ?',type:'single',items:['−2','−1','0','+1'],answer:['−1'],hint:'В KCl калий имеет степень окисления +1. Сумма степеней окисления в нейтральном соединении равна нулю.',ok:'Верно! В KCl хлор имеет степень окисления −1. Диск остановился на нужном значении.'},
{title:'Два перепутанных механизма',question:'Укажи, кто окислитель, а кто восстановитель. Выбери вещество и затем нажми на его роль.',eq:'H₂ + Cl₂ = 2HCl',type:'pair',items:['H₂','Cl₂'],hint:'Хлор понижает степень окисления с 0 до −1, а водород повышает с 0 до +1.',ok:'Отлично! Cl₂ — окислитель, H₂ — восстановитель. Механические передачи синхронизированы.'},
{title:'Последняя блокировка!',question:'Отметь ВСЕ окислительно-восстановительные реакции. После проверки аварийный шлюз откроется.',eq:'',type:'multi',items:['А. Zn + 2HCl = ZnCl₂ + H₂','Б. HCl + NaOH = NaCl + H₂O','В. Cl₂ + 2KBr = 2KCl + Br₂','Г. AgNO₃ + NaCl = AgCl↓ + NaNO₃'],answer:['А. Zn + 2HCl = ZnCl₂ + H₂','В. Cl₂ + 2KBr = 2KCl + Br₂'],hint:'Найди реакции, в которых меняются степени окисления элементов. Обычные реакции нейтрализации и обмена здесь не подходят.',ok:'Все верно! Реакции А и В — окислительно-восстановительные. Аварийный шлюз разблокирован!'}
];
let n=0, selected=new Set(), assigned={},active=null,solved=false,sound=false,finished=false;
const danger=[20,18,16,14,13,12];
const say=(text,kind='')=>{$('message').textContent=text;$('message').className='message '+kind};
function beep(good=true){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ctx=new A();const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(good?640:220,ctx.currentTime);gain.gain.setValueAtTime(.045,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.connect(gain).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2);o.onended=()=>ctx.close()}catch(e){}}
function openDialog(title,text){$('toastTitle').textContent=title;$('toastText').textContent=text;$('toast').classList.add('show')}
$('toastOK').onclick=()=>$('toast').classList.remove('show');
$('hint').onclick=()=>openDialog('Подсказка',tasks[n].hint);
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫ Вкл.':'♫ Звук';beep()};
$('full').onclick=()=>{try{if(document.fullscreenElement){document.exitFullscreen()}else if(root.requestFullscreen){root.requestFullscreen().catch(()=>openDialog('Полный экран','Если браузер запретил полноэкранный режим здесь, открой HTML-файл в отдельной вкладке.'))}}catch(e){openDialog('Полный экран','Этот режим недоступен внутри окна просмотра.')}};
$('reset').onclick=()=>{n=0;finished=false;root.classList.remove('won');draw();};
function hud(){$('danger').textContent=danger[finished?5:n]+'%';$('restore').textContent=100-danger[finished?5:n]+'%';$('barD').style.width=danger[finished?5:n]+'%';$('barR').style.width=100-danger[finished?5:n]+'%';$('status').textContent=finished?'Отсек 10 восстановлен':`Восстановлено узлов: ${n} из 5`;root.classList.toggle('running',solved||finished||n>0);[...$('locks').children].forEach((x,i)=>{x.className='lock'+(i<n||finished?' unlocked':'');x.textContent=i<n||finished?'✓':'✕'});$('steps').replaceChildren(...Array.from({length:12},(_,i)=>{let a=document.createElement('span');a.className='cell '+(i<9?'past':i===9?'current':'');a.textContent=i+1;return a}))}
function btn(text,css,onClick){const b=document.createElement('button');b.className=css;b.textContent=text;b.onclick=onClick;return b}
function draw(){selected.clear();assigned={};active=null;solved=false;const t=tasks[n];$('step').textContent=`ЗАДАНИЕ ${n+1} ИЗ 5`;$('headline').textContent=t.title;$('question').textContent=t.question;$('equation').textContent=t.eq;$('equation').style.display=t.eq?'block':'none';$('answers').className=t.type==='pair'?'pair':'choices';$('answers').replaceChildren();$('check').disabled=false;$('next').disabled=true;$('next').textContent=n===4?'Завершить ›':'Далее ›';$('sys').textContent='● СИСТЕМА БЛОКИРОВАНА';say(t.type==='pair'?'Выбери карточку вещества, затем соответствующую роль.':t.type==='multi'?'Отметь все подходящие реакции и нажми «Проверить».':'Выбери ответ, затем нажми «Проверить».');
if(t.type==='pair'){let left=document.createElement('div'),right=document.createElement('div'),l=document.createElement('p');l.textContent='Вещества';left.append(l);for(const x of t.items){let b=btn(x,'pick',()=>{if(solved)return;active=x;left.querySelectorAll('button').forEach(a=>a.classList.toggle('active',a===b))});left.append(b)}
let r=document.createElement('p');r.textContent='Назначь роли';right.append(r);const wrap=document.createElement('div');wrap.className='pairs';for(const role of ['Окислитель','Восстановитель']){let b=btn('', 'slot',()=>{if(solved)return;if(!active){say('Сначала выбери вещество слева.','no');return}for(const k in assigned){if(assigned[k]===active)delete assigned[k]}assigned[role]=active;active=null;left.querySelectorAll('button').forEach(x=>x.classList.remove('active'));updateSlots()});b.dataset.role=role;wrap.append(b)}right.append(wrap);$('answers').append(left,right);function updateSlots(){wrap.querySelectorAll('button').forEach(b=>{const role=b.dataset.role;b.replaceChildren();const s=document.createElement('span');s.textContent=role;const v=document.createElement('b');v.textContent=assigned[role]||'Нажми';b.append(s,v);b.classList.toggle('has',!!assigned[role])})}updateSlots();}
else{for(const x of t.items){let b=btn(x,'pick',()=>{if(solved)return;if(t.type==='single')selected=new Set([x]);else if(selected.has(x))selected.delete(x);else selected.add(x);$('answers').querySelectorAll('button').forEach(a=>a.classList.toggle('active',selected.has(a.textContent)));});$('answers').append(b)}}
hud();}
$('check').onclick=()=>{if(solved)return;const t=tasks[n];let ok=false;if(t.type==='pair'){if(!assigned['Окислитель']||!assigned['Восстановитель']){say('Назначь оба вещества перед проверкой.','no');return}ok=assigned['Окислитель']==='Cl₂'&&assigned['Восстановитель']==='H₂'}
else{if(!selected.size){say('Сначала выбери вариант ответа.','no');return}ok=selected.size===t.answer.length&&[...selected].every(x=>t.answer.includes(x))}
if(!ok){say('Пока неверно. Попробуй ещё раз или открой подсказку.','no');beep(false);return}
solved=true;say(t.ok,'ok');beep(true);$('check').disabled=true;$('next').disabled=false;$('sys').textContent='● МЕХАНИЗМ ВОССТАНОВЛЕН';$('answers').querySelectorAll('.active').forEach(x=>x.classList.add('ok'));root.classList.add('running');hud()};
$('next').onclick=()=>{if(!solved)return;if(n<4){n++;draw()}else{finished=true;root.classList.add('won','running');hud();$('next').disabled=true;openDialog('Шлюз открыт!', 'Десятый отсек пройден. Опасность снижена до 12%, восстановление лаборатории — 88%. Все пять механизмов восстановлены.')}};
draw();})();
</script>
<script>/* Внедряется в каждый утверждённый HTML без изменения игровых заданий. */
(function(){
'use strict';
const sector=10, source='chem-tracker';
const topics={1:'Физические свойства галогенов',2:'Безопасность в лаборатории',3:'Электроотрицательность галогенов',4:'Химическая связь',5:'Соляная кислота и её растворы',6:'Металлы и кислоты',7:'Реакции кислот с оксидами, основаниями и солями',8:'Хлориды и качественные реакции',9:'Вытеснение галогенов',10:'Окислители и восстановители',11:'Электронный баланс',12:'Химические свойства: итоговые задания'};
const qtopics={
5:{1:'Формулы кислот',2:'Среда раствора кислоты',3:'Ионы соляной кислоты',4:'Свойства плавиковой кислоты',5:'Названия галогеноводородных кислот'},
6:{1:'Металлы и соляная кислота',2:'Водород как продукт реакции',3:'Коэффициенты в реакции металла с кислотой',4:'Ряд активности металлов',5:'Металлы, вытесняющие водород'},
7:{1:'Основные оксиды и кислоты',2:'Нейтрализация кислот основаниями',3:'Карбонаты и выделение CO₂',4:'Силикаты и кремниевая кислота',5:'Распознавание химических реакций'},
8:{1:'Названия и формулы хлоридов',2:'Реактив на хлорид-ионы',3:'Осадок хлорида серебра',4:'Уравнение реакции обмена',5:'Осадки галогенидов серебра'},
9:{1:'Вытеснение галогенов хлором',2:'Вытеснение иода бромом',3:'Невозможные реакции вытеснения',4:'Продукты и коэффициенты реакций',5:'Цепочка реакций галогенов'},
10:{1:'Окислитель',2:'Восстановитель',3:'Степени окисления',4:'Окислитель и восстановитель',5:'Распознавание ОВР'},
11:{1:'Степень окисления железа',2:'Число отданных электронов',3:'Число принятых электронов',4:'Наименьшее общее число электронов',5:'Коэффициенты методом электронного баланса'},
12:{1:'Основные оксиды и соляная кислота',2:'Гидроксиды и соляная кислота',3:'Карбонаты и соляная кислота',4:'Качественная реакция на хлорид-ион',5:'Вытеснение галогенов',6:'Металлы и соляная кислота: коэффициенты'}
};
const key='chem_lab_learning_log_v1';let seq=0,doneOnce=false,lastQ=0,previousTitle='',pending=null;const successSeen=new Set();
const read=id=>document.getElementById(id);
const counterIds=['questionIndex','questionNo','qCounter','counter','number','count','step'];
const textIds=['taskTitle','taskText','questionText','prompt','question','questionTitle','headline'];
const feedbackIds=['feedback','message','guide','reply','anStatus'];
const nextIds=['nextBtn','next','mainNext'];
function q(){for(const id of counterIds){const a=read(id);if(!a)continue;const s=(a.textContent||'').trim();const m=s.match(/(?:ЗАДАНИЕ|Задание)\s*(\d{1,2})\s*(?:из|ИЗ|\/)\s*(\d{1,2})/);if(m)return Number(m[1]);}return lastQ||1;}
function title(){for(const id of textIds){const a=read(id);if(a){const s=(a.textContent||'').trim().slice(0,180);if(s&&!/^(ЗАДАНИЕ|Задание)/.test(s))return s;}}return `${topics[sector]} — задание ${q()}`;}
function feedback(){for(const id of feedbackIds){const e=read(id);if(e&&((e.className||'').includes('feedback')||id==='message'||id==='guide'||id==='reply')){return {el:e,text:(e.textContent||'').replace(/\s+/g,' ').trim().slice(0,450),cls:String(e.className||'').toLowerCase()}}}return {text:'',cls:''}}
function outcome(data){const s=data.text.toLowerCase(),cls=data.cls;
 if(/\b(correct|success|good|ok)\b/.test(cls)||/(?:^|[.!\s])(?:верно|правильно|отлично|молодец|превосходно|да, верно)/i.test(s))return 'right';
 if(/\b(wrong|error|bad|mistake)\b/.test(cls)||/(?:неверно|ошибка|пока неверно|неправильно|попробуй ещё|попробуй снова|не тот)/.test(s))return 'wrong';
 return '';
}
function sourceAnswer(t,isCheck=false){if(!t)return '';
 const c=t.closest?.('button,[role="button"],.option,.chip,.choice,.reactionCard,.vessel,.card,.saltBottle,.molecule');
 if(!isCheck){let direct=String(c?.getAttribute('aria-label')||c?.getAttribute('title')||c?.textContent?.trim()||c?.id||t.id||'');return direct.slice(0,160)}
 const deck=['#choices','#answers','#answerDeck','#answerArea','#choiceDeck','#options','#optionsPanel','#reactionGrid'].map(s=>document.querySelector(s)).find(Boolean)||document;
 const selected=[...deck.querySelectorAll('.selected,.active,.chosen,.picked,.sel')].filter(e=>e.textContent.trim()&&e.textContent.length<70).map(e=>e.textContent.trim()).slice(0,6);
 return selected.length?selected.join(' + '):String(c?.getAttribute('aria-label')||c?.getAttribute('title')||c?.textContent?.trim()||c?.id||t.id||'').slice(0,160);
}
function emit(type,detail={}){const e={source,event:{id:`${sector}.${Date.now()}.${++seq}`,at:new Date().toISOString(),type,sector,question:detail.question||q(),topic:(qtopics[sector]||{})[detail.question||q()]||topics[sector],title:detail.title||title(),answer:detail.answer||'',feedback:detail.feedback||'',correct:detail.correct,step:detail.step||''}};
 if(window.parent!==window){try{window.parent.postMessage(e,'*')}catch(_){}}
 try{const x=JSON.parse(localStorage.getItem(key)||'null')||{version:1,startedAt:new Date().toISOString(),events:[],reflections:{},practice:[],lastSector:sector};if(!Array.isArray(x.events))x.events=[];if(!x.startedAt)x.startedAt=new Date().toISOString();x.lastSector=Math.max(x.lastSector||1,sector);x.events.push(e.event);if(type==='complete'&&sector===12)x.endedAt=new Date().toISOString();localStorage.setItem(key,JSON.stringify(x));}catch(_){}}
window.labTelemetry={attempt({correct,selected,feedback:fb,step}={}){emit('attempt',{correct,answer:Array.isArray(selected)?selected.join(' + '):String(selected||''),feedback:fb,step})},hint(){emit('hint')},complete(){if(!doneOnce){doneOnce=true;emit('complete');}}};
window.labReport=window.labTelemetry;
emit('start',{question:0});
function currentNextEnabled(){return nextIds.some(id=>{const a=read(id);return !!a&&!a.disabled&&getComputedStyle(a).display!=='none'});}
function sample(c){if(!c||c.recorded||c.cancelled)return;const oldq=c.question, nowq=q(),data=feedback();const r=outcome(data);
 const right=(r==='right'||((!c.nextWasEnabled&&currentNextEnabled())&&nowq===oldq));
 const wrong=r==='wrong'&&(data.text!==c.fb.text||data.cls!==c.fb.cls||c.isCheck);
 const changed=nowq!==oldq;
 if(right||wrong||changed){const sk=c.question+'|'+c.title+'|'+(read('counter')?.textContent||'');if((right||changed)&&successSeen.has(sk))return; c.recorded=true;if(right||changed)successSeen.add(sk);emit('attempt',{question:oldq,title:c.title,answer:c.answer,feedback:data.text,correct:!!(right||changed)});if(right||changed){lastQ=nowq;previousTitle=title()}}
}
const helpIds=/^(helpBtn|help|hint|hintBtn|btnHint|btnInfo)$/i;
const checkIds=/^(check|checkBtn|actionBtn|btnCheck)$/i;
const skipIds=/^(next|nextBtn|mainNext|start|startBtn|closeBtn|modalClose|full|fullBtn|fullscreen|soundBtn|sound|btnQuestion|reset|btnReset|toastOK|popupClose)$/i;
document.addEventListener('click',e=>{const t=e.target.closest?.('button,[role="button"],.option,.choice,.chip,.reactionCard,.vessel,.card,.saltBottle,.molecule')||e.target;
 const id=String(t.id||'');const txt=(t.textContent||'').trim().toLowerCase();
 if(helpIds.test(id)||(/подсказк/.test(txt)&&t.tagName==='BUTTON')){if(!window.__CHEM_NATIVE_TRACKING__)emit('hint');return}
 if(skipIds.test(id)||/^(дальше|далее|сброс|заново|начать|понятно)$/i.test(txt))return;
 // 12-й отсек содержит точные события в родной логике; не дублируем.
 if(window.__CHEM_NATIVE_TRACKING__)return;
 const isCheck=checkIds.test(id)||/проверить/i.test(txt);if(pending)pending.cancelled=true;
 const c={question:q(),title:title(),answer:sourceAnswer(t,isCheck),fb:feedback(),nextWasEnabled:currentNextEnabled(),isCheck,recorded:false,cancelled:false};pending=c;
 setTimeout(()=>sample(c),0);setTimeout(()=>sample(c),150);setTimeout(()=>sample(c),550);setTimeout(()=>sample(c),1100);
},true);
// Служебные отметки завершения: не подменяют реальные ответы ученика.
const watch=new MutationObserver(()=>{if(doneOnce)return;const counter=counterIds.map(x=>read(x)?.textContent||'').join(' ').toLowerCase();const s=counter+' '+(read('prompt')?.textContent||'').toLowerCase();if(/отсек.*(?:восстановлен|стабилизирован|пройден)|лаборатория спасена/.test(s)&&!/[0-9]+\s*из\s*[0-9]+/.test(s))window.labTelemetry.complete();});
const obs=[...counterIds,...textIds].map(read).filter(Boolean);
for(const o of obs)watch.observe(o,{childList:true,characterData:true,subtree:true});
})();
</script>

/* Единая фирменная подпись: логотип поверх фона, ссылка на действующий домен. */
(function(){
function addBrand(){
  var host=document.querySelector('.game-stage')||document.querySelector('.stage')||document.querySelector('#game')||document.querySelector('main');
  if(!host||host.querySelector('.mir-brand'))return;

<script>
(function(){
function removeDuplicateTransition(){
 const nodes=document.querySelectorAll('button,a');
 nodes.forEach(el=>{
   const label=(el.textContent||'').trim().replace(/\s+/g,' ').toLowerCase();
   if(!/(следующий отсек|следующий уровень|перейти в следующий отсек)/i.test(label))return;
   if(el.closest('.mir-brand'))return;
   const holder=el.closest('.bottom,.bottom-nav,.bottomBar,.footer,.controls,.actions');
   if(holder)el.style.display='none';
 });
}
new MutationObserver(removeDuplicateTransition).observe(document.body,{childList:true,subtree:true,characterData:true});
removeDuplicateTransition();
})();
