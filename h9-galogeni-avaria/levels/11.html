.tint{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 73% 47%,transparent 0 23%,#040d1638 55%),linear-gradient(90deg,#04111a65,transparent 74%);pointer-events:none}
/* Transparent animated mechanical overlay; does not obscure real machinery. */
.engine{position:absolute;z-index:3;left:58%;top:38%;width:33%;height:24%;pointer-events:none;border:.24cqw solid #9eb7c766;border-radius:2.8cqw;box-shadow:0 0 1.6cqw #27c7ed28,inset 0 0 1.4cqw #5dd9f33b;background:linear-gradient(180deg,#14405328,#19495309);overflow:hidden;transform:rotate(-2deg)}
.engine:before,.engine:after{content:'';position:absolute;inset:13% 3%;border-radius:2.7cqw;border:.23cqw solid #96c2d976;box-shadow:inset 0 0 .7cqw #33b6fc38}
.engine:after{inset:37% 8%;border:.5cqw solid #89c5d441}
.particle{position:absolute;left:-7%;top:45%;width:1.4cqw;height:1.4cqw;border-radius:50%;background:#87f5ff;box-shadow:0 0 1.1cqw .4cqw #16d5ff,0 0 2.3cqw #16d5ff;animation:electron 4.3s linear infinite;animation-play-state:paused;opacity:0}
.particle:nth-child(2){animation-delay:-1.1s;top:29%}.particle:nth-child(3){animation-delay:-2.2s;top:63%}.particle:nth-child(4){animation-delay:-3.3s;top:47%}
.stage.running .particle{animation-play-state:running;opacity:.93}@keyframes electron{from{transform:translateX(0) scale(.6);opacity:0}12%{opacity:1}80%{opacity:1}to{transform:translateX(33cqw) scale(1);opacity:0}}
.wheel{position:absolute;z-index:4;left:82%;top:60%;width:10%;aspect-ratio:1;border:.65cqw double #899ca2;border-radius:50%;box-shadow:inset 0 0 1cqw #223b4c,0 0 1.3cqw #000;animation:gearspin 12s linear infinite;animation-play-state:paused;pointer-events:none}
.wheel:before,.wheel:after{content:'';position:absolute;left:49%;top:6%;height:88%;width:.65cqw;background:linear-gradient(90deg,#768d9d,#cbd6d3);border-radius:.4cqw}.wheel:after{transform:rotate(60deg)}
.stage.running .wheel{animation-play-state:running}@keyframes gearspin{to{transform:rotate(360deg)}}
.redGlow{position:absolute;z-index:1;right:1%;top:7%;width:20%;height:35%;border-radius:50%;background:radial-gradient(ellipse,#e9302a24,transparent 68%);animation:alert 2.5s infinite alternate;pointer-events:none}@keyframes alert{to{opacity:.25}}
/* Emergency door at far right; opens only on final successful solution. */
.door{position:absolute;right:1.6%;top:19%;height:58%;width:17.6%;z-index:3;pointer-events:none;border:.48cqw solid #63757d;border-radius:.8cqw;background:#0b141bc9;box-shadow:inset 0 0 2cqw #000,0 0 2cqw #000a;overflow:hidden}
.doorPanel{position:absolute;top:0;height:100%;width:50%;background:repeating-linear-gradient(180deg,#53636d 0 12%,#1f2d36 13% 15%,#455760 16% 27%);border:.25cqw solid #647c89;transition:transform 1.7s ease}
.doorPanel.left{left:0}.doorPanel.right{right:0}.doorPanel:after{content:'';position:absolute;top:30%;bottom:20%;left:44%;border-left:.7cqw ridge #afbec1}.doorPanel.right:after{left:27%}.stage.won .doorPanel.left{transform:translateX(-104%)}.stage.won .doorPanel.right{transform:translateX(104%)}
/* Consistent top HUD and controls (large readable type). */
.meter{position:absolute;z-index:14;top:.8%;height:8.5%;display:flex;align-items:center;gap:.55cqw;padding:.3cqw .72cqw;border:.14cqw solid #ef6c78;border-radius:.7cqw;background:#07151ee8;box-shadow:0 .1cqw 1cqw #0009}.meter.danger{left:1.2%;width:23%}.meter.restore{right:12.1%;width:18%;border-color:#6af9c2}.meter .sym{font-size:2.4cqw}.meter strong{font-size:2.1cqw;line-height:1;color:#ff988a}.meter.restore strong{color:#74ffb9}.meter small{display:block;font-size:1.14cqw;font-weight:900}.meter .bar{height:.45cqw;border-radius:.5cqw;margin-top:.2cqw;background:#1b2c33;overflow:hidden}.meter i{display:block;height:100%;background:#ff6d72;transition:width .7s}.meter.restore i{background:#4dea9f}
.topTitle{position:absolute;left:25.1%;top:1.2%;width:43.7%;height:7.6%;z-index:14;display:flex;flex-direction:column;align-items:center;justify-content:center;border:.14cqw solid #79ccd9;border-radius:.8cqw;background:#071723eb;text-align:center}.topTitle strong{font-size:1.97cqw;line-height:1.07}.topTitle span{font-size:1.25cqw;color:#ffe2a1;font-weight:800}
.iconBtn{position:absolute;top:1.65%;height:6.35%;width:3.2%;z-index:16;border:.13cqw solid #75c8e0;border-radius:.6cqw;background:#102b3ae8;color:white;font-size:2.06cqw;font-weight:900}.iconBtn:hover{background:#1c536b}#hintBtn{right:8.35%}#soundBtn{right:4.55%}#fullBtn{right:.75%}
/* Question panel keeps mechanical scene visible to the right. */
.mission{position:absolute;z-index:12;left:2.4%;top:12%;width:53.8%;max-height:76%;border:.17cqw solid #76b4c5;border-radius:1.12cqw;background:linear-gradient(140deg,#081923ed,#071925e9);box-shadow:0 .6cqw 2cqw #0008;display:flex;flex-direction:column;gap:.54cqw;padding:1.05cqw 1.25cqw;overflow:auto}
.kicker{display:flex;justify-content:space-between;align-items:center;gap:.9cqw;color:#ffdd9e;font-weight:900;font-size:1.3cqw}
.title{font-size:2.25cqw;line-height:1.12;font-weight:900;color:#f6fbff}
.question{font-size:1.55cqw;line-height:1.29;font-weight:800;color:#dff3fa}
.equation{display:flex;justify-content:center;align-items:center;min-height:4.25cqw;padding:.35cqw;border:.11cqw solid #b4a47778;border-radius:.63cqw;background:#29302688;color:#fff0cc;font-size:2.18cqw;font-weight:900;text-align:center;line-height:1.16}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6cqw}
.choice{min-height:4.2cqw;border:.16cqw solid #68a9bf;border-radius:.67cqw;padding:.6cqw .55cqw;background:linear-gradient(155deg,#173c4c,#112735);color:#f3feff;font-weight:900;font-size:1.85cqw;line-height:1.14;text-align:center}
.choice:hover:not(:disabled){background:#195068;border-color:#c6f5ff}.choice.selected{border-color:#ffd887;background:#59421fe8}.choice.good{background:#0b6441;border-color:#83ffc0}.choice.bad{background:#67302d;border-color:#ff9b8f}
.feedback{font-size:1.44cqw;line-height:1.25;min-height:2.2cqw;border-left:.32cqw solid #51d4f8;border-radius:.34cqw;background:#102f3e;padding:.46cqw .65cqw;color:#e7f9ff;font-weight:850}.feedback.good{background:#104837;border-color:#69ffb9;color:#c7ffe4}.feedback.bad{background:#522824;border-color:#ff8d79;color:#ffe0d1}
.controls{display:flex;align-items:center;justify-content:space-between;gap:.7cqw}.btn{border:.12cqw solid #94c0cd;border-radius:.6cqw;background:#214a59;color:white;font-weight:900;font-size:1.43cqw;padding:.68cqw 1cqw}.btn.primary{border-color:#a5ffce;background:linear-gradient(#289e6b,#126f49)}.btn:disabled{opacity:.4}
/* Number dials in the final puzzle. */
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.65cqw}.dial{border:.18cqw solid #6db3bd;background:linear-gradient(#183948,#10242f);border-radius:.72cqw;padding:.48cqw;display:flex;flex-direction:column;align-items:center;gap:.25cqw;color:#fff}.dial span{font-size:1.3cqw;font-weight:850;color:#e6f8ff}.dial strong{font-size:2.55cqw;line-height:1.13;color:#ffdf9d}.dial small{font-size:1.06cqw;color:#9ed5e8}.dial:hover{border-color:#ffe1a1;background:#244956}
/* Right side status and gate, without large dark rectangle. */
.hardwareTag{position:absolute;z-index:10;right:4%;top:13%;width:31%;padding:.65cqw .8cqw;border:.12cqw solid #7b9eab;border-radius:.74cqw;background:#061723b8;color:#e8faff;text-align:center;font-weight:900;font-size:1.22cqw}.hardwareTag b{display:block;color:#ffe3a1;font-size:1.64cqw;margin-top:.16cqw}
.energy{position:absolute;z-index:10;right:4.5%;bottom:15%;width:31%;padding:.7cqw .85cqw;background:#0b1f2ad9;border:.1cqw solid #78bdcd;border-radius:.73cqw;box-shadow:0 0 1cqw #0007}.energyText{display:flex;justify-content:space-between;align-items:center;font-size:1.2cqw;font-weight:900}.energyText strong{color:#6affbc;font-size:1.4cqw}.energyBar{width:100%;height:1cqw;margin-top:.35cqw;border:.1cqw solid #6c909c;border-radius:.55cqw;background:#071019;overflow:hidden}.energyBar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#257ec6,#63fbd7);box-shadow:0 0 1cqw #1be8f5;transition:width 1s}

function q(){for(const id of counterIds){const a=read(id);if(!a)continue;const s=(a.textContent||'').trim();const m=s.match(/(?:ЗАДАНИЕ|Задание)\s*(\d{1,2})\s*(?:из|ИЗ|\/)\s*(\d{1,2})/);if(m)return Number(m[1]);}return lastQ||1;}
function title(){for(const id of textIds){const a=read(id);if(a){const s=(a.textContent||'').trim().slice(0,180);if(s&&!/^(ЗАДАНИЕ|Задание)/.test(s))return s;}}return `${topics[sector]} — задание ${q()}`;}
function feedback(){for(const id of feedbackIds){const e=read(id);if(e&&((e.className||'').includes('feedback')||id==='message'||id==='guide'||id==='reply')){return {el:e,text:(e.textContent||'').replace(/\s+/g,' ').trim().slice(0,450),cls:String(e.className||'').toLowerCase()}}}return {text:'',cls:''}}
function outcome(data){const s=data.text.toLowerCase(),cls=data.cls;
 if(/\b(correct|success|good|ok)\b/.test(cls)||/(?:^|[.!\s])(?:верно|правильно|отлично|молодец|превосходно|да, верно)/i.test(s))return 'right';
 if(/\b(wrong|error|bad|mistake)\b/.test(cls)||/(?:неверно|ошибка|пока неверно|неправильно|попробуй ещё|попробуй снова|не тот)/.test(s))return 'wrong';
 return '';
}
function sourceAnswer(t,isCheck=false){if(!t)return '';
 const c=t.closest?.('button,[role="button"],.option,.chip,.choice,.reactionCard,.vessel,.card,.saltBottle,.molecule');
 if(!isCheck){let direct=String(c?.getAttribute('aria-label')||c?.getAttribute('title')||c?.textContent?.trim()||c?.id||t.id||'');return direct.slice(0,160)}
 const deck=['#choices','#answers','#answerDeck','#answerArea','#choiceDeck','#options','#optionsPanel','#reactionGrid'].map(s=>document.querySelector(s)).find(Boolean)||document;
 const selected=[...deck.querySelectorAll('.selected,.active,.chosen,.picked,.sel')].filter(e=>e.textContent.trim()&&e.textContent.length<70).map(e=>e.textContent.trim()).slice(0,6);
 return selected.length?selected.join(' + '):String(c?.getAttribute('aria-label')||c?.getAttribute('title')||c?.textContent?.trim()||c?.id||t.id||'').slice(0,160);
}
function emit(type,detail={}){const e={source,event:{id:`${sector}.${Date.now()}.${++seq}`,at:new Date().toISOString(),type,sector,question:detail.question||q(),topic:(qtopics[sector]||{})[detail.question||q()]||topics[sector],title:detail.title||title(),answer:detail.answer||'',feedback:detail.feedback||'',correct:detail.correct,step:detail.step||''}};
 if(window.parent!==window){try{window.parent.postMessage(e,'*')}catch(_){}}
 try{const x=JSON.parse(localStorage.getItem(key)||'null')||{version:1,startedAt:new Date().toISOString(),events:[],reflections:{},practice:[],lastSector:sector};if(!Array.isArray(x.events))x.events=[];if(!x.startedAt)x.startedAt=new Date().toISOString();x.lastSector=Math.max(x.lastSector||1,sector);x.events.push(e.event);if(type==='complete'&&sector===12)x.endedAt=new Date().toISOString();localStorage.setItem(key,JSON.stringify(x));}catch(_){}}
window.labTelemetry={attempt({correct,selected,feedback:fb,step}={}){emit('attempt',{correct,answer:Array.isArray(selected)?selected.join(' + '):String(selected||''),feedback:fb,step})},hint(){emit('hint')},complete(){if(!doneOnce){doneOnce=true;emit('complete');}}};
window.labReport=window.labTelemetry;
emit('start',{question:0});
function currentNextEnabled(){return nextIds.some(id=>{const a=read(id);return !!a&&!a.disabled&&getComputedStyle(a).display!=='none'});}
function sample(c){if(!c||c.recorded||c.cancelled)return;const oldq=c.question, nowq=q(),data=feedback();const r=outcome(data);
 const right=(r==='right'||((!c.nextWasEnabled&&currentNextEnabled())&&nowq===oldq));
 const wrong=r==='wrong'&&(data.text!==c.fb.text||data.cls!==c.fb.cls||c.isCheck);
 const changed=nowq!==oldq;
 if(right||wrong||changed){const sk=c.question+'|'+c.title+'|'+(read('counter')?.textContent||'');if((right||changed)&&successSeen.has(sk))return; c.recorded=true;if(right||changed)successSeen.add(sk);emit('attempt',{question:oldq,title:c.title,answer:c.answer,feedback:data.text,correct:!!(right||changed)});if(right||changed){lastQ=nowq;previousTitle=title()}}
}
const helpIds=/^(helpBtn|help|hint|hintBtn|btnHint|btnInfo)$/i;
const checkIds=/^(check|checkBtn|actionBtn|btnCheck)$/i;
const skipIds=/^(next|nextBtn|mainNext|start|startBtn|closeBtn|modalClose|full|fullBtn|fullscreen|soundBtn|sound|btnQuestion|reset|btnReset|toastOK|popupClose)$/i;
document.addEventListener('click',e=>{const t=e.target.closest?.('button,[role="button"],.option,.choice,.chip,.reactionCard,.vessel,.card,.saltBottle,.molecule')||e.target;
 const id=String(t.id||'');const txt=(t.textContent||'').trim().toLowerCase();
 if(helpIds.test(id)||(/подсказк/.test(txt)&&t.tagName==='BUTTON')){if(!window.__CHEM_NATIVE_TRACKING__)emit('hint');return}
 if(skipIds.test(id)||/^(дальше|далее|сброс|заново|начать|понятно)$/i.test(txt))return;
 // 12-й отсек содержит точные события в родной логике; не дублируем.
 if(window.__CHEM_NATIVE_TRACKING__)return;
 const isCheck=checkIds.test(id)||/проверить/i.test(txt);if(pending)pending.cancelled=true;
 const c={question:q(),title:title(),answer:sourceAnswer(t,isCheck),fb:feedback(),nextWasEnabled:currentNextEnabled(),isCheck,recorded:false,cancelled:false};pending=c;
 setTimeout(()=>sample(c),0);setTimeout(()=>sample(c),150);setTimeout(()=>sample(c),550);setTimeout(()=>sample(c),1100);
},true);
// Служебные отметки завершения: не подменяют реальные ответы ученика.
const watch=new MutationObserver(()=>{if(doneOnce)return;const counter=counterIds.map(x=>read(x)?.textContent||'').join(' ').toLowerCase();const s=counter+' '+(read('prompt')?.textContent||'').toLowerCase();if(/отсек.*(?:восстановлен|стабилизирован|пройден)|лаборатория спасена/.test(s)&&!/[0-9]+\s*из\s*[0-9]+/.test(s))window.labTelemetry.complete();});
const obs=[...counterIds,...textIds].map(read).filter(Boolean);
for(const o of obs)watch.observe(o,{childList:true,characterData:true,subtree:true});
})();
</script>

<script>
(function(){
function removeDuplicateTransition(){
 const nodes=document.querySelectorAll('button,a');
 nodes.forEach(el=>{
   const label=(el.textContent||'').trim().replace(/\s+/g,' ').toLowerCase();
   if(!/(следующий отсек|следующий уровень|перейти в следующий отсек)/i.test(label))return;
   if(el.closest('.mir-brand'))return;
   const holder=el.closest('.bottom,.bottom-nav,.bottomBar,.footer,.controls,.actions');
   if(holder)el.style.display='none';
 });
}
new MutationObserver(removeDuplicateTransition).observe(document.body,{childList:true,subtree:true,characterData:true});
removeDuplicateTransition();
})();
</script>
