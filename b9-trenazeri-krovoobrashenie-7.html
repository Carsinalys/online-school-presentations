}
@media(max-height:550px){.help-panel{gap:5px;padding:9px}.help-intro,.help-items p{font-size:clamp(12px,1.25vw,16px)}.help-items{gap:4px}.help-panel h2{font-size:24px}.help-fine{font-size:12px}.help-close{min-height:29px}.review-question{font-size:clamp(12px,1.14vw,17px)}}
@media(max-height:600px) and (max-aspect-ratio:4/3){
 .stage{padding:3px 5px;gap:1px}.top{flex-wrap:nowrap;font-size:9px}.top .site{display:none}.right-tools{gap:3px}.help-button{width:24px;height:24px;font-size:16px}
 .progress-wrap{gap:1px}.progress-caption{font-size:9px}.progress-track{height:2px}
 .review-screen{gap:2px}.review-head h1{font-size:20px}.verdict{font-size:15px}.review-head{gap:8px}
 .review-question{font-size:10.6px;line-height:1.1}.review-summary{font-size:10.5px;line-height:1.1}
 .code-lines{gap:1px}.code-row{font-size:10.5px;gap:2px;flex-wrap:nowrap}.code-row .label{width:94px;min-width:94px}.digit{min-width:18px;height:19px;font-size:11px;padding:1px 3px}

 .explain{gap:2px}.explain h2{font-size:15px}.explain p{font-size:11px;line-height:1.1}
 .bottom .action{min-height:27px;font-size:12px;padding:2px 8px}.status{font-size:10px}
}
@media(max-height:460px) and (min-aspect-ratio:4/3){
 .stage{padding:3px 9px;gap:1px}.top{font-size:9px}.help-button{width:25px;height:25px;font-size:16px}
 .progress-wrap{gap:1px}.progress-caption{font-size:9px}.progress-track{height:2px}
 .review-screen{gap:1px}.review-head{gap:7px}.review-head h1{font-size:19px}.verdict{font-size:15px}
 .review-question{font-size:10.5px;line-height:1.08}.review-summary{font-size:10.5px;line-height:1.09}
 .code-lines{gap:1px}.code-row{font-size:10px;line-height:1.05;gap:3px}.code-row .label{min-width:100px}.digit{min-width:17px;height:18px;font-size:10px;border-radius:4px}
 .review-errors{font-size:10px;line-height:1.07}.answer-content{gap:1px}.full-route{font-size:11px;line-height:1.1}
 .explain{gap:1px}.explain h2{font-size:15px}.explain p{font-size:11px;line-height:1.08}

@media (max-height:500px) and (min-aspect-ratio:4/3){

}

   &lt;h1&gt;Маршрут крови&lt;/h1&gt;
   &lt;h2&gt;Путь вещества к органу-мишени&lt;/h2&gt;
   &lt;p class=&quot;motto&quot;&gt;Теперь мало знать порядок: определите, какие структуры действительно нужны веществу на пути к органу!&lt;/p&gt;
   &lt;div class=&quot;fine&quot;&gt;В каждом задании семь вариантов. Выберите только необходимые и выстройте маршрут. Сколько вариантов нужно использовать, предстоит определить самостоятельно. Можно перетаскивать плашки или выбирать их касаниями.&lt;/div&gt;
   &lt;p class=&quot;intro-help-note&quot;&gt;Перед началом откроется памятка «Обрати внимание!» о названиях сосудов. В дальнейшем она всегда доступна по кнопке &lt;strong&gt;?&lt;/strong&gt;.&lt;/p&gt;
   &lt;button type=&quot;button&quot; class=&quot;action primary&quot; id=&quot;start&quot;&gt;Начать тренировку&lt;/button&gt;
  &lt;/main&gt;

   &lt;p class=&quot;question&quot; id=&quot;question&quot;&gt;&lt;/p&gt;
   &lt;p class=&quot;hint&quot; id=&quot;hint&quot;&gt;&lt;span class=&quot;hint-long&quot;&gt;&lt;strong&gt;Выберите элементы слева.&lt;/strong&gt; В «Моём маршруте» нажмите две плашки, чтобы поменять местами; × — убрать. Можно перетаскивать.&lt;/span&gt;&lt;span class=&quot;hint-short&quot;&gt;&lt;strong&gt;Выбирайте слева.&lt;/strong&gt; Две плашки — обмен; × — убрать.&lt;/span&gt;&lt;/p&gt;

    &lt;section class=&quot;bucket&quot;&gt;&lt;h2&gt;Предложенные элементы &lt;span class=&quot;count&quot;&gt;7 вариантов&lt;/span&gt;&lt;/h2&gt;&lt;div class=&quot;list choices&quot; id=&quot;choiceList&quot; aria-label=&quot;Семь вариантов ответа&quot;&gt;&lt;/div&gt;&lt;/section&gt;

   &lt;div class=&quot;help-panel&quot;&gt;
    &lt;h2 id=&quot;helpTitle&quot;&gt;Обрати внимание!&lt;/h2&gt;
    &lt;p class=&quot;help-intro&quot;&gt;Эти названия сосудов помогут определить направление движения крови. Они встречаются среди вариантов ответа.&lt;/p&gt;
    &lt;div class=&quot;help-items&quot;&gt;
     &lt;p&gt;&lt;strong&gt;Яремные вены&lt;/strong&gt; — отводят кровь от головы и шеи в сторону верхней полой вены.&lt;/p&gt;
     &lt;p&gt;&lt;strong&gt;Сонные артерии&lt;/strong&gt; — несут кровь к голове, в том числе к головному мозгу.&lt;/p&gt;
     &lt;p&gt;&lt;strong&gt;Подключичные вены&lt;/strong&gt; — отводят кровь от верхних конечностей в сторону верхней полой вены.&lt;/p&gt;
     &lt;p&gt;&lt;strong&gt;Бедренные артерии&lt;/strong&gt; — несут кровь к нижним конечностям. &lt;strong&gt;Бедренные вены&lt;/strong&gt; — отводят кровь от нижних конечностей.&lt;/p&gt;
     &lt;p&gt;&lt;strong&gt;Сосуды печени:&lt;/strong&gt; воротная вена печени → капилляры печени → печёночная вена → нижняя полая вена.&lt;/p&gt;
    &lt;/div&gt;
    &lt;p class=&quot;help-fine&quot;&gt;В задании нужно расположить только предложенные элементы. Некоторые промежуточные сосуды могут быть пропущены.&lt;/p&gt;
    &lt;button type=&quot;button&quot; class=&quot;action primary help-close&quot; id=&quot;helpClose&quot;&gt;Вернуться к заданию&lt;/button&gt;
