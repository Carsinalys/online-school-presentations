&lt;script id=&quot;bank-data&quot; type=&quot;application/json&quot;&gt;[{&quot;id&quot;:1,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;Пациенту ввели лекарственный препарат в яремную вену. Его действующее вещество должно поступить с кровью к работающим мышцам голени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Верхняя полая вена&quot;,&quot;Правое предсердие&quot;,&quot;Капилляры лёгких&quot;,&quot;Левое предсердие&quot;,&quot;Капилляры мышц голени&quot;,&quot;Аорта&quot;,&quot;Яремная вена&quot;],&quot;answer&quot;:[6,0,1,2,3,5,4],&quot;route&quot;:&quot;Яремная вена → Верхняя полая вена → Правое предсердие → Капилляры лёгких → Левое предсердие → Аорта → Капилляры мышц голени.&quot;,&quot;explanation&quot;:&quot;Из яремной вены препарат поступает в верхнюю полую вену, затем через правые камеры сердца и малый круг кровообращения — в левую половину сердца. Из аорты он доставляется к мышцам голени; между показанными пунктами существуют дополнительные сосуды и клапаны, не включённые в перечень.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., §§ 27–28 «Сердце. Кровообращение»; Борисов, 9 кл., § 33 «Газообмен и транспорт газов»&quot;},{&quot;id&quot;:2,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;Лекарство ввели в вену предплечья. Врач прослеживает поступление вещества к капиллярам головного мозга. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры головного мозга&quot;,&quot;Лёгочные вены&quot;,&quot;Нижняя полая вена&quot;,&quot;Правый желудочек&quot;,&quot;Верхняя полая вена&quot;,&quot;Сонная артерия&quot;,&quot;Подключичная вена&quot;],&quot;answer&quot;:[6,4,3,1,5,0],&quot;route&quot;:&quot;Подключичная вена → Верхняя полая вена → Правый желудочек → Лёгочные вены → Сонная артерия → Капилляры головного мозга.&quot;,&quot;explanation&quot;:&quot;Из вен предплечья кровь через более крупные сосуды достигает подключичной и верхней полой вен. Затем лекарство проходит правые отделы сердца, лёгкие и левые отделы сердца и по ветвям аорты, включая сонную артерию, поступает к мозгу. Нижняя полая вена не является путём оттока от руки.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:3,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;Лекарственное вещество введено в бедренную вену. Определите его путь по кровеносной системе до капилляров лёгких. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Бедренная вена&quot;,&quot;Аорта&quot;,&quot;Капилляры лёгких&quot;,&quot;Правое предсердие&quot;,&quot;Нижняя полая вена&quot;,&quot;Правый желудочек&quot;,&quot;Левое предсердие&quot;],&quot;answer&quot;:[0,4,3,5,2],&quot;route&quot;:&quot;Бедренная вена → Нижняя полая вена → Правое предсердие → Правый желудочек → Капилляры лёгких.&quot;,&quot;explanation&quot;:&quot;От нижней конечности венозная кровь направляется к нижней полой вене и правой половине сердца. Из правого желудочка она по лёгочному стволу и лёгочным артериям поступает к капиллярам лёгких. До достижения этих капилляров ни аорта, ни левое предсердие не проходятся.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:4,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;При исследовании коронарного кровотока контрастное вещество ввели в аорту. Нужно установить его путь к капиллярам сердечной мышцы. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Артериолы сердечной мышцы&quot;,&quot;Правый желудочек&quot;,&quot;Аорта&quot;,&quot;Лёгочные артерии&quot;,&quot;Капилляры сердечной мышцы&quot;,&quot;Коронарные артерии&quot;,&quot;Верхняя полая вена&quot;],&quot;answer&quot;:[2,5,0,4],&quot;route&quot;:&quot;Аорта → Коронарные артерии → Артериолы сердечной мышцы → Капилляры сердечной мышцы.&quot;,&quot;explanation&quot;:&quot;Коронарные (венечные) артерии отходят от аорты и снабжают миокард кровью. Контрастное вещество движется по их ветвям к артериолам, затем к капиллярам. Правый желудочек и лёгочные артерии не лежат между аортой и коронарными капиллярами.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:5,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;Препарат введён в вену бедра. Его молекулы должны достичь капилляров почки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры лёгких&quot;,&quot;Правая половина сердца&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры почки&quot;,&quot;Бедренная вена&quot;,&quot;Почечная артерия&quot;,&quot;Левая половина сердца&quot;],&quot;answer&quot;:[4,2,1,0,6,5,3],&quot;route&quot;:&quot;Бедренная вена → Нижняя полая вена → Правая половина сердца → Капилляры лёгких → Левая половина сердца → Почечная артерия → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;Из вен ноги кровь собирается в нижнюю полую вену, проходит правую половину сердца и малый круг кровообращения. Из левой половины сердца кровь поступает в аорту и через почечную артерию — к капиллярным сетям почки. В перечне использованы обобщённые названия половин сердца.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:6,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;Человек принял таблетку с водорастворимым действующим веществом. Часть вещества всосалась из тонкой кишки в кровь, сохранилась при прохождении через печень и должна попасть к мозгу. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры головного мозга&quot;,&quot;Капилляры печени&quot;,&quot;Аорта&quot;,&quot;Воротная вена печени&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры тонкой кишки&quot;,&quot;Нижняя полая вена&quot;],&quot;answer&quot;:[5,3,1,6,2,0],&quot;route&quot;:&quot;Капилляры тонкой кишки → Воротная вена печени → Капилляры печени → Нижняя полая вена → Аорта → Капилляры головного мозга.&quot;,&quot;explanation&quot;:&quot;После всасывания водорастворимые молекулы попадают из кишечных капилляров в воротную вену и сначала проходят печень. Затем кровь оттекает в нижнюю полую вену, проходит сердце и лёгкие, возвращается в левое сердце и по аорте направляется к мозгу. В перечне не все промежуточные участки названы: через лёгочный круг вещество проходит обязательно.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:7,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;Во время диагностической процедуры контраст ввели непосредственно в левый желудочек. Требуется определить последовательность его поступления к капиллярам кожи стопы. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Бедренная артерия&quot;,&quot;Левый желудочек&quot;,&quot;Полулунные клапаны аорты&quot;,&quot;Капилляры лёгких&quot;,&quot;Правое предсердие&quot;,&quot;Аорта&quot;,&quot;Капилляры кожи стопы&quot;],&quot;answer&quot;:[1,2,5,0,6],&quot;route&quot;:&quot;Левый желудочек → Полулунные клапаны аорты → Аорта → Бедренная артерия → Капилляры кожи стопы.&quot;,&quot;explanation&quot;:&quot;При сокращении левого желудочка кровь через полулунные клапаны аорты поступает в большой круг. По артериям нижней конечности контраст достигает кожных капилляров стопы. Малый круг и правое предсердие на этом участке пути не участвуют.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., §§ 27–28 «Сердце. Кровообращение»&quot;},{&quot;id&quot;:8,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;Врач ввёл контрастное вещество в начальный отдел аорты, чтобы проследить его прохождение к сосудистой сети почки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Артериолы почки&quot;,&quot;Почечная артерия&quot;,&quot;Лёгочные артерии&quot;,&quot;Лёгочные вены&quot;,&quot;Правый желудочек&quot;,&quot;Капилляры почки&quot;,&quot;Аорта&quot;],&quot;answer&quot;:[6,1,0,5],&quot;route&quot;:&quot;Аорта → Почечная артерия → Артериолы почки → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;От аорты отходит почечная артерия. Она делится на более мелкие ветви и артериолы, от которых кровь попадает в капилляры почки. Сердце и лёгочные сосуды уже предшествовали аорте и не входят в описанный участок прохождения.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:9,&quot;category&quot;:&quot;Лекарственные Вещества&quot;,&quot;question&quot;:&quot;В вену нижней конечности ввели обезболивающее вещество, которое должно достичь тканей кисти. Определите его путь к капиллярам кожи кисти. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры лёгких&quot;,&quot;Нижняя полая вена&quot;,&quot;Верхняя полая вена&quot;,&quot;Аорта&quot;,&quot;Бедренная вена&quot;,&quot;Капилляры кожи кисти&quot;,&quot;Правый желудочек&quot;],&quot;answer&quot;:[4,1,6,0,3,5],&quot;route&quot;:&quot;Бедренная вена → Нижняя полая вена → Правый желудочек → Капилляры лёгких → Аорта → Капилляры кожи кисти.&quot;,&quot;explanation&quot;:&quot;Вещество от ноги поступает по венам в нижнюю полую вену и правые камеры сердца. После малого круга оно возвращается в левое сердце, затем по аорте и её ветвям достигает капилляров кисти. Верхняя полая вена не является венозным путём от нижней конечности.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:10,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;У подростка передняя доля гипофиза выделила соматотропин. Гормон должен с кровью достичь тканей растущей кости голени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры растущей кости голени&quot;,&quot;Капилляры лёгких&quot;,&quot;Капилляры передней доли гипофиза&quot;,&quot;Аорта&quot;,&quot;Правая половина сердца&quot;,&quot;Верхняя полая вена&quot;,&quot;Яремная вена&quot;],&quot;answer&quot;:[2,6,5,4,1,3,0],&quot;route&quot;:&quot;Капилляры передней доли гипофиза → Яремная вена → Верхняя полая вена → Правая половина сердца → Капилляры лёгких → Аорта → Капилляры растущей кости голени.&quot;,&quot;explanation&quot;:&quot;Соматотропин (гормон роста) вырабатывается передней долей гипофиза и регулирует рост и физическое развитие. С венозной кровью из области головы он проходит правое сердце и лёгкие, затем через левое сердце и артерии большого круга достигает тканей кости. На клетки зоны роста он влияет через межклеточную жидкость.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 15 «Гипофиз»; Дашков, 11 кл., § 9 «Биологически активные вещества»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:11,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Задняя доля гипофиза выделила в кровь вазопрессин. Определите основные пункты его доставки к капиллярам почки, где он сможет воздействовать на эпителий почечных канальцев. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Аорта&quot;,&quot;Капилляры кишечника&quot;,&quot;Воротная вена печени&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры задней доли гипофиза&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры почки&quot;],&quot;answer&quot;:[4,3,0,6],&quot;route&quot;:&quot;Капилляры задней доли гипофиза → Верхняя полая вена → Аорта → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;Вазопрессин синтезируется в гипоталамусе, накапливается и выделяется в кровь через заднюю долю гипофиза. Далее кровь от головы проходит правое сердце, лёгкие, левое сердце и аорту. Гормон усиливает обратное всасывание воды в почках, уменьшая объём мочи; кишечная воротная система не относится к его пути.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 15 «Гипофиз»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:12,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;В ответ на растяжение шейки матки в кровь из задней доли гипофиза выделился окситоцин. Он должен достичь мышечных клеток матки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры задней доли гипофиза&quot;,&quot;Правый желудочек&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры матки&quot;,&quot;Подвздошная артерия&quot;,&quot;Лёгочные вены&quot;,&quot;Аорта&quot;],&quot;answer&quot;:[0,2,1,5,6,4,3],&quot;route&quot;:&quot;Капилляры задней доли гипофиза → Верхняя полая вена → Правый желудочек → Лёгочные вены → Аорта → Подвздошная артерия → Капилляры матки.&quot;,&quot;explanation&quot;:&quot;Окситоцин синтезируется гипоталамусом и выделяется из задней доли гипофиза. Пройдя через правое сердце, лёгкие и левое сердце, гормон с артериальной кровью поступает к матке. Он усиливает сокращения её гладкой мышечной ткани, участвующие в родах.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 15 «Гипофиз»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:13,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Щитовидная железа выделила тироксин, который влияет на обмен веществ и работу сердца. Проследите путь гормона от капилляров щитовидной железы до капилляров сердечной мышцы. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Коронарные артерии&quot;,&quot;Верхняя полая вена&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры сердечной мышцы&quot;,&quot;Яремная вена&quot;,&quot;Капилляры щитовидной железы&quot;,&quot;Капилляры лёгких&quot;],&quot;answer&quot;:[5,4,1,6,0,3],&quot;route&quot;:&quot;Капилляры щитовидной железы → Яремная вена → Верхняя полая вена → Капилляры лёгких → Коронарные артерии → Капилляры сердечной мышцы.&quot;,&quot;explanation&quot;:&quot;Тироксин образуется в щитовидной железе и регулирует обмен веществ, в том числе в клетках сердца. От капилляров железы кровь по яремным венам направляется к верхней полой вене, затем проходит через сердце и лёгкие. С артериальной кровью гормон достигает миокарда по коронарным артериям. Названия яремных вен поясняются в постоянной справке «Обрати внимание!».&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 16 «Щитовидная железа и надпочечники»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:14,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Щитовидная железа образовала трийодтиронин, регулирующий обмен веществ. Определите его путь от сосудов железы до капилляров печени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Верхняя полая вена&quot;,&quot;Аорта&quot;,&quot;Правая половина сердца&quot;,&quot;Воротная вена печени&quot;,&quot;Капилляры печени&quot;,&quot;Капилляры щитовидной железы&quot;,&quot;Нижняя полая вена&quot;],&quot;answer&quot;:[5,0,2,1,4],&quot;route&quot;:&quot;Капилляры щитовидной железы → Верхняя полая вена → Правая половина сердца → Аорта → Капилляры печени.&quot;,&quot;explanation&quot;:&quot;Трийодтиронин, как и тироксин, синтезируется в щитовидной железе при участии йода. Из шеи гормон переносится к правому сердцу, затем через лёгкие и левое сердце попадает в аорту и по артериальным сосудам доставляется к печени. Воротная вена — путь от пищеварительных органов, а не отток от щитовидной железы.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 16 «Щитовидная железа и надпочечники»; Дашков, 11 кл., § 9 «Биологически активные вещества»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:15,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Во время стрессовой ситуации мозговое вещество правого надпочечника выделило адреналин. Гормон должен поступить к капиллярам миокарда, где он увеличивает частоту и силу сердечных сокращений. Проследите путь адреналина по кровеносной системе. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Верхняя полая вена&quot;,&quot;Аорта&quot;,&quot;Капилляры сердечной мышцы&quot;,&quot;Капилляры правого надпочечника&quot;,&quot;Воротная вена печени&quot;,&quot;Капилляры кишечника&quot;,&quot;Нижняя полая вена&quot;],&quot;answer&quot;:[3,6,1,2],&quot;route&quot;:&quot;Капилляры правого надпочечника → Нижняя полая вена → Аорта → Капилляры сердечной мышцы.&quot;,&quot;explanation&quot;:&quot;Адреналин образуется в мозговом веществе надпочечников и при стрессе увеличивает частоту и силу сердечных сокращений. От правого надпочечника кровь поступает в нижнюю полую вену, проходит правую половину сердца, лёгкие и левую половину сердца. Далее через аорту и коронарные сосуды гормон достигает миокарда. Адреналин также способствует повышению содержания глюкозы в крови.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 16 «Щитовидная железа и надпочечники»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:16,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;При резком снижении содержания глюкозы в крови пациенту ввели препарат глюкагона в мышцу плеча. После всасывания в кровь гормон должен достичь печени, где он способствует расщеплению гликогена. Проследите путь глюкагона от капилляров мышц плеча до капилляров печени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Нижняя полая вена&quot;,&quot;Верхняя полая вена&quot;,&quot;Правая половина сердца&quot;,&quot;Лёгочные вены&quot;,&quot;Капилляры печени&quot;,&quot;Аорта&quot;,&quot;Капилляры мышц плеча&quot;],&quot;answer&quot;:[6,1,2,3,5,4],&quot;route&quot;:&quot;Капилляры мышц плеча → Верхняя полая вена → Правая половина сердца → Лёгочные вены → Аорта → Капилляры печени.&quot;,&quot;explanation&quot;:&quot;Глюкагон повышает содержание глюкозы в крови, в частности стимулирует расщепление гликогена в печени. После всасывания в капилляры мышц плеча препарат с венозной кровью достигает верхней полой вены и правой половины сердца. Далее кровь проходит малый круг, возвращается по лёгочным венам в левую половину сердца и через аорту направляется к печени. Нижняя полая вена не относится к венозному пути от плеча.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 17 «Железы смешанной секреции»; § 28 «Кровообращение»&quot;},{&quot;id&quot;:17,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Корковое вещество правого надпочечника выделило кортизол. Отследите его поступление к капиллярам скелетных мышц бедра. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Правая половина сердца&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры лёгких&quot;,&quot;Капилляры мышц бедра&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры правого надпочечника&quot;,&quot;Воротная вена печени&quot;],&quot;answer&quot;:[5,1,0,2,3],&quot;route&quot;:&quot;Капилляры правого надпочечника → Нижняя полая вена → Правая половина сердца → Капилляры лёгких → Капилляры мышц бедра.&quot;,&quot;explanation&quot;:&quot;Кортизол — гормон коры надпочечников. Он влияет на обмен белков, жиров и углеводов и помогает организму адаптироваться к стрессу. Перенесясь из надпочечника через нижнюю полую вену и малый круг кровообращения, кортизол доставляется к мышцам по артериям большого круга.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 16 «Щитовидная железа и надпочечники»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:18,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Корковое вещество правого надпочечника выделило альдостерон. Нужно установить основные контрольные пункты поступления гормона в капилляры почки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры почки&quot;,&quot;Воротная вена печени&quot;,&quot;Верхняя полая вена&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры кишечника&quot;,&quot;Почечная артерия&quot;,&quot;Капилляры правого надпочечника&quot;],&quot;answer&quot;:[6,3,5,0],&quot;route&quot;:&quot;Капилляры правого надпочечника → Нижняя полая вена → Почечная артерия → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;Альдостерон секретируется корой надпочечников и усиливает обратное всасывание натрия в почечных канальцах. Из правого надпочечника он проходит нижнюю полую вену, сердце, лёгкие, аорту и затем почечную артерию. Он действует на клетки нефрона после доставки кровью, но не перемещается как часть мочи.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 16 «Щитовидная железа и надпочечники»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:19,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Пациенту с сахарным диабетом ввели инсулин подкожно в область плеча. После всасывания в кровь препарат должен поступить к мышцам бедра и способствовать поглощению глюкозы клетками. Проследите путь инсулина от капилляров кожи плеча до капилляров мышц бедра. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Нижняя полая вена&quot;,&quot;Аорта&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры мышц бедра&quot;,&quot;Подключичная вена&quot;,&quot;Капилляры кожи плеча&quot;,&quot;Капилляры лёгких&quot;],&quot;answer&quot;:[5,4,2,6,1,3],&quot;route&quot;:&quot;Капилляры кожи плеча → Подключичная вена → Верхняя полая вена → Капилляры лёгких → Аорта → Капилляры мышц бедра.&quot;,&quot;explanation&quot;:&quot;Инсулин помогает клеткам мышц поглощать глюкозу, снижая её содержание в крови. После подкожного введения препарат всасывается в кровеносные капилляры в области плеча. Затем кровь оттекает по венам верхней конечности через подключичную и верхнюю полую вены к сердцу, проходит малый круг кровообращения и снова поступает в левую половину сердца. С артериальной кровью инсулин достигает мышц бедра. В задании начальный пункт обозначен упрощённо — «капилляры кожи плеча».&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 17 «Железы смешанной секреции»; § 28 «Кровообращение»&quot;},{&quot;id&quot;:20,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Под действием глюкагона клетки печени расщепляют гликоген и высвобождают глюкозу в кровь. Проследите путь глюкозы от капилляров печени до капилляров головного мозга. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Печёночная вена&quot;,&quot;Верхняя полая вена&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры головного мозга&quot;,&quot;Капилляры лёгких&quot;,&quot;Капилляры печени&quot;,&quot;Воротная вена печени&quot;],&quot;answer&quot;:[5,0,2,4,3],&quot;route&quot;:&quot;Капилляры печени → Печёночная вена → Нижняя полая вена → Капилляры лёгких → Капилляры головного мозга.&quot;,&quot;explanation&quot;:&quot;Глюкагон вырабатывается поджелудочной железой и стимулирует распад гликогена в печени. Здесь отслеживается не глюкагон, а высвобождаемая глюкоза: она выходит по печёночным венам в нижнюю полую вену, проходит сердце и лёгкие и достигает мозга с артериальной кровью. Воротная вена направляет кровь в печень, а не из неё.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 17 «Железы смешанной секреции»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:21,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Щитовидная железа выделила тироксин, который участвует в регуляции обмена веществ. Проследите путь гормона от капилляров щитовидной железы до капилляров мышц бедра. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Нижняя полая вена&quot;,&quot;Аорта&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры щитовидной железы&quot;,&quot;Капилляры мышц бедра&quot;,&quot;Капилляры лёгких&quot;,&quot;Яремная вена&quot;],&quot;answer&quot;:[3,6,2,5,1,4],&quot;route&quot;:&quot;Капилляры щитовидной железы → Яремная вена → Верхняя полая вена → Капилляры лёгких → Аорта → Капилляры мышц бедра.&quot;,&quot;explanation&quot;:&quot;Тироксин образуется в щитовидной железе и влияет на обмен веществ во многих тканях, в том числе в скелетных мышцах. От железы кровь оттекает по яремным венам в систему верхней полой вены, проходит правую половину сердца, капилляры лёгких и левую половину сердца. Затем гормон переносится по аорте и её ветвям к капиллярам мышц бедра.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 16 «Щитовидная железа и надпочечники»; § 28 «Кровообращение»&quot;},{&quot;id&quot;:22,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Правый яичник выделил эстрогены. Гормоны должны достигнуть тканей матки и повлиять на состояние её слизистой оболочки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Нижняя полая вена&quot;,&quot;Капилляры лёгких&quot;,&quot;Капилляры правого яичника&quot;,&quot;Левый желудочек&quot;,&quot;Капилляры матки&quot;,&quot;Правое предсердие&quot;,&quot;Аорта&quot;],&quot;answer&quot;:[2,0,5,1,3,6,4],&quot;route&quot;:&quot;Капилляры правого яичника → Нижняя полая вена → Правое предсердие → Капилляры лёгких → Левый желудочек → Аорта → Капилляры матки.&quot;,&quot;explanation&quot;:&quot;Эстрогены образуются в яичниках, участвуют в регуляции функций женской половой системы и развитии женских половых признаков. Венозная кровь от правого яичника возвращается к нижней полой вене, проходит лёгкие и через левое сердце направляется к матке по артериям большого круга.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 17 «Железы смешанной секреции»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:23,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;Щитовидная железа выделила тироксин. Установите последовательность его поступления к капиллярам почки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры щитовидной железы&quot;,&quot;Капилляры почки&quot;,&quot;Нижняя полая вена&quot;,&quot;Воротная вена печени&quot;,&quot;Капилляры лёгких&quot;,&quot;Почечная артерия&quot;,&quot;Верхняя полая вена&quot;],&quot;answer&quot;:[0,6,4,5,1],&quot;route&quot;:&quot;Капилляры щитовидной железы → Верхняя полая вена → Капилляры лёгких → Почечная артерия → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;Тироксин регулирует интенсивность обменных процессов, а также влияет на рост и развитие. Из сосудов шеи гормон через верхнюю полую вену, сердце и лёгкие попадает в аорту и затем в почечную артерию. Нижняя полая вена и воротная вена печени не относятся к оттоку крови от щитовидной железы.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 16 «Щитовидная железа и надпочечники»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:24,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;После рождения ребёнка гипоталамус обеспечил образование окситоцина; гормон выделился в кровь из задней доли гипофиза. Он должен достичь молочной железы для выделения уже образовавшегося молока. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Верхняя полая вена&quot;,&quot;Правое предсердие&quot;,&quot;Капилляры молочной железы&quot;,&quot;Нижняя полая вена&quot;,&quot;Аорта&quot;,&quot;Яремная вена&quot;,&quot;Капилляры задней доли гипофиза&quot;],&quot;answer&quot;:[6,5,0,1,4,2],&quot;route&quot;:&quot;Капилляры задней доли гипофиза → Яремная вена → Верхняя полая вена → Правое предсердие → Аорта → Капилляры молочной железы.&quot;,&quot;explanation&quot;:&quot;Окситоцин синтезируется в гипоталамусе, выделяется из задней доли гипофиза и с кровью доставляется к молочным железам после прохождения сердца и лёгких. Он вызывает сокращение миоэпителиальных клеток и выделение молока, но не является основным гормоном образования молока.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 15 «Гипофиз»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:25,&quot;category&quot;:&quot;Гормоны&quot;,&quot;question&quot;:&quot;При недостатке воды задняя доля гипофиза выделила вазопрессин. Проследите путь гормона к почечным сосудам. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Почечная лоханка&quot;,&quot;Аорта&quot;,&quot;Капилляры лёгких&quot;,&quot;Яремная вена&quot;,&quot;Правый желудочек&quot;,&quot;Капилляры почки&quot;,&quot;Капилляры задней доли гипофиза&quot;],&quot;answer&quot;:[6,3,4,2,1,5],&quot;route&quot;:&quot;Капилляры задней доли гипофиза → Яремная вена → Правый желудочек → Капилляры лёгких → Аорта → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;Вазопрессин поступает в кровь задней доли гипофиза после синтеза в гипоталамусе, затем с кровью через сердце и лёгкие достигает почек. Он усиливает реабсорбцию воды в канальцах нефрона. Почечная лоханка служит для сбора мочи, а не для доставки гормона кровью.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 15 «Гипофиз»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:26,&quot;category&quot;:&quot;Пищеварение&quot;,&quot;question&quot;:&quot;После употребления хлеба содержащийся в нём крахмал продолжил расщепляться в тонкой кишке под действием амилазы поджелудочной железы. Затем под действием мальтазы образовалась глюкоза. Часть глюкозы всосалась в кровь и направилась в печень. Проследите путь глюкозы от капилляров тонкой кишки до капилляров печени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Аорта&quot;,&quot;Лёгочные артерии&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры печени&quot;,&quot;Венулы кишечника&quot;,&quot;Воротная вена печени&quot;,&quot;Капилляры тонкой кишки&quot;],&quot;answer&quot;:[6,4,5,3],&quot;route&quot;:&quot;Капилляры тонкой кишки → Венулы кишечника → Воротная вена печени → Капилляры печени.&quot;,&quot;explanation&quot;:&quot;Амилаза начинает расщепление крахмала до более простых углеводов, а мальтаза обеспечивает образование глюкозы. В тонкой кишке глюкоза всасывается в кровеносные капилляры ворсинок. Через венулы кишечника и воротную вену печени она поступает к капиллярам печени. Аорта, лёгочные артерии и нижняя полая вена не входят в путь между кишечными капиллярами и капиллярами печени.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 37 «Обмен веществ и энергии»&quot;},{&quot;id&quot;:27,&quot;category&quot;:&quot;Пищеварение&quot;,&quot;question&quot;:&quot;После переваривания белковой пищи аминокислоты всосались в капилляры тонкой кишки. Часть их прошла печень и должна поступить к клеткам работающих мышц плеча. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Нижняя полая вена&quot;,&quot;Капилляры тонкой кишки&quot;,&quot;Аорта&quot;,&quot;Воротная вена печени&quot;,&quot;Капилляры печени&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры мышц плеча&quot;],&quot;answer&quot;:[1,3,4,0,2,6],&quot;route&quot;:&quot;Капилляры тонкой кишки → Воротная вена печени → Капилляры печени → Нижняя полая вена → Аорта → Капилляры мышц плеча.&quot;,&quot;explanation&quot;:&quot;При пищеварении белки расщепляются до аминокислот, которые всасываются в капилляры тонкой кишки. Аминокислоты проходят через воротную вену и печень, затем кровь возвращается к сердцу по нижней полой вене. После прохождения лёгких аминокислоты могут достигать мышц плеча через аорту и её артериальные ветви.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 37 «Обмен веществ и энергии»&quot;},{&quot;id&quot;:28,&quot;category&quot;:&quot;Пищеварение&quot;,&quot;question&quot;:&quot;После всасывания глюкозы из тонкой кишки часть её прошла печень и должна поступить к работающим мышцам голени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Нижняя полая вена&quot;,&quot;Верхняя полая вена&quot;,&quot;Почечная артерия&quot;,&quot;Капилляры мышц голени&quot;,&quot;Капилляры печени&quot;,&quot;Воротная вена печени&quot;,&quot;Капилляры тонкой кишки&quot;],&quot;answer&quot;:[6,5,4,0,3],&quot;route&quot;:&quot;Капилляры тонкой кишки → Воротная вена печени → Капилляры печени → Нижняя полая вена → Капилляры мышц голени.&quot;,&quot;explanation&quot;:&quot;Глюкоза всасывается из тонкой кишки в кровь, поступает через воротную вену в печень, где может запасаться в форме гликогена. Часть глюкозы проходит далее к сердцу, через лёгкие и артериальную систему достигает мышц голени. Верхняя полая вена не является непосредственным оттоком от печени.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 37 «Обмен веществ и энергии»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:29,&quot;category&quot;:&quot;Пищеварение&quot;,&quot;question&quot;:&quot;После переваривания белка пищи часть аминокислот поступила из тонкой кишки в печень и затем вышла из неё в составе крови. Проследите путь аминокислот от печёночной вены до капилляров головного мозга. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Нижняя полая вена&quot;,&quot;Капилляры головного мозга&quot;,&quot;Мочеточник&quot;,&quot;Верхняя полая вена&quot;,&quot;Воротная вена печени&quot;,&quot;Лёгочные вены&quot;,&quot;Печёночная вена&quot;],&quot;answer&quot;:[6,0,5,1],&quot;route&quot;:&quot;Печёночная вена → Нижняя полая вена → Лёгочные вены → Капилляры головного мозга.&quot;,&quot;explanation&quot;:&quot;Всосавшиеся аминокислоты сначала попадают из кишечника в печень по воротной вене. Те молекулы, которые проходят дальше, оттекают по печёночной вене в нижнюю полую вену и достигают правого сердца. После газообмена кровь по лёгочным венам возвращается в левое сердце и направляется к мозгу. Мочеточник не участвует в переносе аминокислот кровью.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:30,&quot;category&quot;:&quot;Пищеварение&quot;,&quot;question&quot;:&quot;В толстой кишке произошло всасывание воды из содержимого кишечника в кровеносные капилляры. Проследите путь этой воды от капилляров ободочной кишки через печень до капилляров почки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры почки&quot;,&quot;Аорта&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры ободочной кишки&quot;,&quot;Верхняя полая вена&quot;,&quot;Воротная вена печени&quot;,&quot;Капилляры печени&quot;],&quot;answer&quot;:[3,5,6,2,1,0],&quot;route&quot;:&quot;Капилляры ободочной кишки → Воротная вена печени → Капилляры печени → Нижняя полая вена → Аорта → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;В толстой кишке всасывается вода. Кровь от ободочной кишки по воротной вене поступает в капилляры печени. Затем она оттекает от печени к нижней полой вене и проходит сердце и малый круг кровообращения. После этого вода может переноситься с кровью по аорте к почкам. Название промежуточной печёночной вены ученику здесь запоминать не нужно.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:31,&quot;category&quot;:&quot;Пищеварение&quot;,&quot;question&quot;:&quot;Растворённые минеральные вещества всосались в кровеносные капилляры тонкой кишки. Необходимо отследить доставку этих ионов к капиллярам мышц плеча. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры тонкой кишки&quot;,&quot;Верхняя полая вена&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры мышц плеча&quot;,&quot;Капилляры почки&quot;,&quot;Капилляры печени&quot;,&quot;Воротная вена печени&quot;],&quot;answer&quot;:[0,6,5,2,3],&quot;route&quot;:&quot;Капилляры тонкой кишки → Воротная вена печени → Капилляры печени → Нижняя полая вена → Капилляры мышц плеча.&quot;,&quot;explanation&quot;:&quot;Водорастворимые минеральные ионы всасываются в кишечные кровеносные капилляры и сначала попадают в печень через воротную вену. Затем они проходят нижнюю полую вену, сердце, лёгкие и артерии верхней конечности. Ионы необходимы, в частности, для возбудимости и сокращения мышечных клеток.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 20 «Работа мышц»&quot;},{&quot;id&quot;:32,&quot;category&quot;:&quot;Пищеварение&quot;,&quot;question&quot;:&quot;После питья вода всосалась в капилляры ворсинок тонкой кишки. Установите её путь через печень до правого предсердия сердца. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Воротная вена печени&quot;,&quot;Капилляры печени&quot;,&quot;Лёгочные вены&quot;,&quot;Печёночная вена&quot;,&quot;Верхняя полая вена&quot;,&quot;Капилляры тонкой кишки&quot;,&quot;Правое предсердие&quot;],&quot;answer&quot;:[5,0,1,3,6],&quot;route&quot;:&quot;Капилляры тонкой кишки → Воротная вена печени → Капилляры печени → Печёночная вена → Правое предсердие.&quot;,&quot;explanation&quot;:&quot;Вода всасывается в кровь тонкой кишки и по воротной вене сначала проходит капиллярную систему печени. Из печени она уходит по печёночной вене, далее через нижнюю полую вену попадает в правое предсердие. Лёгочные вены переносят кровь из лёгких к левому предсердию и не входят в этот начальный участок движения воды.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 36 «Пищеварение»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:33,&quot;category&quot;:&quot;Мочевая Система И Обмен&quot;,&quot;question&quot;:&quot;В клетках печени в процессе обмена азотсодержащих веществ образовалась мочевина. Проследите кровеносный путь мочевины из печени к капиллярам почки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Мочеточник&quot;,&quot;Воротная вена печени&quot;,&quot;Почечная лоханка&quot;,&quot;Печёночная вена&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры почки&quot;,&quot;Капилляры печени&quot;],&quot;answer&quot;:[6,3,4,5],&quot;route&quot;:&quot;Капилляры печени → Печёночная вена → Нижняя полая вена → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;Мочевина образуется в печени, поступает в кровь и выходит из неё через печёночные вены в нижнюю полую вену. После прохождения сердца и лёгких она по аорте и почечной артерии достигает кровеносных капилляров почки. Лоханка и мочеточник относятся уже к пути мочи, а не крови.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 37 «Обмен веществ и энергии»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:34,&quot;category&quot;:&quot;Мочевая Система И Обмен&quot;,&quot;question&quot;:&quot;Мочевина из кровотока печени должна попасть в капиллярный клубочек нефрона, где происходит фильтрация плазмы крови. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Воротная вена печени&quot;,&quot;Печёночная вена&quot;,&quot;Нижняя полая вена&quot;,&quot;Почечная артерия&quot;,&quot;Капилляры клубочка нефрона&quot;,&quot;Мочеточник&quot;,&quot;Капилляры печени&quot;],&quot;answer&quot;:[6,1,2,3,4],&quot;route&quot;:&quot;Капилляры печени → Печёночная вена → Нижняя полая вена → Почечная артерия → Капилляры клубочка нефрона.&quot;,&quot;explanation&quot;:&quot;Мочевина переносится кровью от печени по печёночным венам, а затем через сердце, лёгкие, аорту и почечную артерию к клубочкам. В клубочках фильтруется часть плазмы с растворённой мочевиной. Мочеточник будет переносить уже образовавшуюся мочу, а не кровь к клубочку.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 37 «Обмен веществ и энергии»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:35,&quot;category&quot;:&quot;Мочевая Система И Обмен&quot;,&quot;question&quot;:&quot;При образовании вторичной мочи часть глюкозы из первичной мочи вернулась в кровеносные капилляры, окружающие канальцы нефрона. Проследите её путь к капиллярам сердечной мышцы. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Аорта&quot;,&quot;Капилляры сердечной мышцы&quot;,&quot;Почечная лоханка&quot;,&quot;Почечная вена&quot;,&quot;Капилляры лёгких&quot;,&quot;Капилляры вокруг канальцев нефрона&quot;,&quot;Нижняя полая вена&quot;],&quot;answer&quot;:[5,3,6,4,0,1],&quot;route&quot;:&quot;Капилляры вокруг канальцев нефрона → Почечная вена → Нижняя полая вена → Капилляры лёгких → Аорта → Капилляры сердечной мышцы.&quot;,&quot;explanation&quot;:&quot;В почечных канальцах глюкоза в норме почти полностью реабсорбируется в кровь окружающей капиллярной сети. Оттуда она оттекает по почечной вене, проходит сердце и лёгкие, затем с артериальной кровью поступает к миокарду. Почечная лоханка собирает мочу и не участвует в кровеносном пути реабсорбированной глюкозы.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:36,&quot;category&quot;:&quot;Мочевая Система И Обмен&quot;,&quot;question&quot;:&quot;Вода, возвращённая в кровь из канальцев нефрона, далее переносится к капиллярам кожи лица. Определите её путь по кровеносной системе. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Правая половина сердца&quot;,&quot;Левая половина сердца&quot;,&quot;Капилляры вокруг канальцев нефрона&quot;,&quot;Капилляры лёгких&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры кожи лица&quot;,&quot;Почечная вена&quot;],&quot;answer&quot;:[2,6,4,0,3,1,5],&quot;route&quot;:&quot;Капилляры вокруг канальцев нефрона → Почечная вена → Нижняя полая вена → Правая половина сердца → Капилляры лёгких → Левая половина сердца → Капилляры кожи лица.&quot;,&quot;explanation&quot;:&quot;Реабсорбция возвращает в кровь большую часть воды первичной мочи. Из капилляров вокруг канальцев она оттекает по почечной вене, затем проходит через правое сердце, лёгкие и левое сердце. Далее вода в составе крови может попасть в кожные капилляры лица через артерии большого круга.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:37,&quot;category&quot;:&quot;Мочевая Система И Обмен&quot;,&quot;question&quot;:&quot;При регуляции водно-солевого обмена ионы натрия вернулись из первичной мочи в капилляры, оплетающие канальцы почки. Определите начальный венозный путь этих ионов до правого предсердия. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Правое предсердие&quot;,&quot;Капилляры вокруг канальцев нефрона&quot;,&quot;Почечная лоханка&quot;,&quot;Нижняя полая вена&quot;,&quot;Почечная вена&quot;,&quot;Мочеточник&quot;,&quot;Мочевой пузырь&quot;],&quot;answer&quot;:[1,4,3,0],&quot;route&quot;:&quot;Капилляры вокруг канальцев нефрона → Почечная вена → Нижняя полая вена → Правое предсердие.&quot;,&quot;explanation&quot;:&quot;Натрий может реабсорбироваться в канальцах под действием механизмов, в том числе регулируемых альдостероном. Из вторичной сети капилляров он с кровью оттекает в почечную вену, нижнюю полую вену и правое предсердие. Лоханка, мочеточник и мочевой пузырь проводят мочу и не относятся к пути вернувшихся в кровь ионов.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:38,&quot;category&quot;:&quot;Мочевая Система И Обмен&quot;,&quot;question&quot;:&quot;После сокращения левого желудочка кровь, содержащая мочевину, направляется к почкам для фильтрации. Проследите её путь до капиллярного клубочка нефрона. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Аорта&quot;,&quot;Полулунные клапаны аорты&quot;,&quot;Левый желудочек&quot;,&quot;Почечная артерия&quot;,&quot;Лёгочные артерии&quot;,&quot;Капилляры клубочка нефрона&quot;,&quot;Мочеточник&quot;],&quot;answer&quot;:[2,1,0,3,5],&quot;route&quot;:&quot;Левый желудочек → Полулунные клапаны аорты → Аорта → Почечная артерия → Капилляры клубочка нефрона.&quot;,&quot;explanation&quot;:&quot;Левый желудочек выбрасывает кровь в аорту через полулунные клапаны. Затем кровь поступает по почечной артерии и её ветвям к клубочковым капиллярам нефрона, где происходит фильтрация. Мочеточник переносит мочу из почки, а не кровь к ней.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., §§ 27–28 «Сердце. Кровообращение»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:39,&quot;category&quot;:&quot;Газообмен&quot;,&quot;question&quot;:&quot;Во время вдоха кислород диффундировал из альвеол в кровь капилляров лёгких. Нужно восстановить его путь до капилляров головного мозга. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Левое предсердие&quot;,&quot;Капилляры лёгких&quot;,&quot;Лёгочные вены&quot;,&quot;Аорта&quot;,&quot;Левый желудочек&quot;,&quot;Двустворчатый клапан&quot;,&quot;Капилляры головного мозга&quot;],&quot;answer&quot;:[1,2,0,5,4,3,6],&quot;route&quot;:&quot;Капилляры лёгких → Лёгочные вены → Левое предсердие → Двустворчатый клапан → Левый желудочек → Аорта → Капилляры головного мозга.&quot;,&quot;explanation&quot;:&quot;Кислород проходит из воздуха альвеол через альвеолярно-капиллярную поверхность в кровь, связывается главным образом с гемоглобином эритроцитов. По лёгочным венам артериальная кровь возвращается в левую половину сердца и выбрасывается в аорту, после чего кислород достигает мозговых капилляров.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:40,&quot;category&quot;:&quot;Газообмен&quot;,&quot;question&quot;:&quot;Кислород поступил из альвеол в кровь. Проследите его движение к капиллярам миокарда, который непрерывно нуждается в энергии. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры сердечной мышцы&quot;,&quot;Правый желудочек&quot;,&quot;Капилляры лёгких&quot;,&quot;Лёгочные вены&quot;,&quot;Левый желудочек&quot;,&quot;Коронарные артерии&quot;,&quot;Левое предсердие&quot;],&quot;answer&quot;:[2,3,6,4,5,0],&quot;route&quot;:&quot;Капилляры лёгких → Лёгочные вены → Левое предсердие → Левый желудочек → Коронарные артерии → Капилляры сердечной мышцы.&quot;,&quot;explanation&quot;:&quot;Насыщенная кислородом кровь возвращается по лёгочным венам в левое предсердие, затем в левый желудочек и аорту. Коронарные артерии доставляют кислород к клеткам миокарда. Правый желудочек находится до лёгочных капилляров и не входит в путь после насыщения крови кислородом.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:41,&quot;category&quot;:&quot;Газообмен&quot;,&quot;question&quot;:&quot;Кислород поступил из альвеол в лёгочные капилляры. Определите его путь до сосудистой сети почки. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Почечная артерия&quot;,&quot;Лёгочные вены&quot;,&quot;Левый желудочек&quot;,&quot;Капилляры почки&quot;,&quot;Лёгочные артерии&quot;,&quot;Правое предсердие&quot;,&quot;Капилляры лёгких&quot;],&quot;answer&quot;:[6,1,2,0,3],&quot;route&quot;:&quot;Капилляры лёгких → Лёгочные вены → Левый желудочек → Почечная артерия → Капилляры почки.&quot;,&quot;explanation&quot;:&quot;После газообмена насыщенная кислородом кровь по лёгочным венам попадает в левую половину сердца. Оттуда кровь через аорту поступает в почечные артерии и капилляры почки, обеспечивая её ткани кислородом. Правое предсердие и лёгочные артерии располагаются до лёгочных капилляров.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 40 «Мочеобразование и его регуляция»&quot;},{&quot;id&quot;:42,&quot;category&quot;:&quot;Газообмен&quot;,&quot;question&quot;:&quot;При сокращении мышц голени образовался углекислый газ. Он поступил в кровь местных капилляров и должен достичь капилляров лёгких. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры лёгких&quot;,&quot;Бедренная вена&quot;,&quot;Нижняя полая вена&quot;,&quot;Левый желудочек&quot;,&quot;Аорта&quot;,&quot;Лёгочные вены&quot;,&quot;Капилляры мышц голени&quot;],&quot;answer&quot;:[6,1,2,0],&quot;route&quot;:&quot;Капилляры мышц голени → Бедренная вена → Нижняя полая вена → Капилляры лёгких.&quot;,&quot;explanation&quot;:&quot;Углекислый газ образуется при клеточном дыхании и поступает из мышечных клеток в кровь. Из капилляров голени он с венозной кровью возвращается через нижнюю полую вену к правому сердцу и по лёгочным артериям достигает лёгочных капилляров, откуда удаляется в альвеолы. Левый желудочек находится после этого этапа.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 28 «Кровообращение»; Дашков, 11 кл., § 21 «Клеточное дыхание. Брожение»&quot;},{&quot;id&quot;:43,&quot;category&quot;:&quot;Газообмен&quot;,&quot;question&quot;:&quot;Нейроны головного мозга образовали углекислый газ, который поступил в кровь мозговых капилляров. Проследите его движение до капилляров лёгких. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Яремная вена&quot;,&quot;Капилляры лёгких&quot;,&quot;Капилляры головного мозга&quot;,&quot;Лёгочные артерии&quot;,&quot;Правый желудочек&quot;,&quot;Верхняя полая вена&quot;,&quot;Правое предсердие&quot;],&quot;answer&quot;:[2,0,5,6,4,3,1],&quot;route&quot;:&quot;Капилляры головного мозга → Яремная вена → Верхняя полая вена → Правое предсердие → Правый желудочек → Лёгочные артерии → Капилляры лёгких.&quot;,&quot;explanation&quot;:&quot;Образовавшийся в нейронах углекислый газ диффундирует в кровь. По венам головы, в том числе яремной вене, он направляется в верхнюю полую вену, правые камеры сердца и далее по лёгочным артериям к капиллярам лёгких. Здесь углекислый газ диффундирует в альвеолы и выдыхается.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 28 «Кровообращение»; Дашков, 11 кл., § 21 «Клеточное дыхание. Брожение»&quot;},{&quot;id&quot;:44,&quot;category&quot;:&quot;Газообмен&quot;,&quot;question&quot;:&quot;Во время физической нагрузки мышцы плеча усилили выделение углекислого газа. Установите его путь от мышечных капилляров до лёгких. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры мышц плеча&quot;,&quot;Верхняя полая вена&quot;,&quot;Лёгочные артерии&quot;,&quot;Капилляры лёгких&quot;,&quot;Нижняя полая вена&quot;,&quot;Подключичная вена&quot;,&quot;Правое предсердие&quot;],&quot;answer&quot;:[0,5,1,6,2,3],&quot;route&quot;:&quot;Капилляры мышц плеча → Подключичная вена → Верхняя полая вена → Правое предсердие → Лёгочные артерии → Капилляры лёгких.&quot;,&quot;explanation&quot;:&quot;При активном клеточном дыхании образующийся углекислый газ переносится кровью от мышц руки к верхней полой вене. Затем он проходит правую половину сердца и через лёгочные артерии попадает в капилляры лёгких. Нижняя полая вена собирает кровь главным образом от нижней части тела и не лежит на этом участке.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 20 «Работа мышц»&quot;},{&quot;id&quot;:45,&quot;category&quot;:&quot;Мышечная Работа&quot;,&quot;question&quot;:&quot;После интенсивного бега часть молочной кислоты, образовавшейся в мышцах голени, поступила в кровь. Проследите путь молочной кислоты от капилляров мышц голени до капилляров печени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Верхняя полая вена&quot;,&quot;Капилляры мышц голени&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры лёгких&quot;,&quot;Воротная вена печени&quot;,&quot;Бедренная вена&quot;,&quot;Капилляры печени&quot;],&quot;answer&quot;:[1,5,2,3,6],&quot;route&quot;:&quot;Капилляры мышц голени → Бедренная вена → Нижняя полая вена → Капилляры лёгких → Капилляры печени.&quot;,&quot;explanation&quot;:&quot;При интенсивной работе мышц может усиливаться образование молочной кислоты. С кровью продукты её образования оттекают по венам нижней конечности к нижней полой вене, затем через сердце и лёгкие попадают в артерии большого круга и доставляются к печени. Воротная вена несёт кровь от органов пищеварения и не является прямым путём от мышц голени.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 20 «Работа мышц»; Борисов, 9 кл., § 28 «Кровообращение»; Дашков, 11 кл., § 21 «Клеточное дыхание. Брожение»&quot;},{&quot;id&quot;:46,&quot;category&quot;:&quot;Мышечная Работа&quot;,&quot;question&quot;:&quot;При ускорении темпа плавания мышцам плеча понадобилось больше кислорода. Проследите путь кислорода по кровеносной системе от капилляров лёгких до капилляров мышц плеча. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Правый желудочек&quot;,&quot;Лёгочные вены&quot;,&quot;Аорта&quot;,&quot;Правое предсердие&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры лёгких&quot;,&quot;Капилляры мышц плеча&quot;],&quot;answer&quot;:[5,1,2,6],&quot;route&quot;:&quot;Капилляры лёгких → Лёгочные вены → Аорта → Капилляры мышц плеча.&quot;,&quot;explanation&quot;:&quot;Кислород диффундирует из альвеол в кровь капилляров лёгких и затем с артериальной кровью по лёгочным венам возвращается в левое сердце. Из аорты он по артериям верхней конечности поступает к работающим мышцам. Правые камеры сердца расположены до лёгочных капилляров.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 20 «Работа мышц»; Борисов, 9 кл., § 28 «Кровообращение»&quot;},{&quot;id&quot;:47,&quot;category&quot;:&quot;Мышечная Работа&quot;,&quot;question&quot;:&quot;Во время длительной нагрузки печень расщепляет гликоген и выделяет глюкозу в кровь. Проследите путь этой глюкозы от сосудов печени до капилляров мышц голени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Аорта&quot;,&quot;Капилляры печени&quot;,&quot;Правая половина сердца&quot;,&quot;Капилляры мышц голени&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры лёгких&quot;,&quot;Печёночная вена&quot;],&quot;answer&quot;:[1,6,4,2,5,0,3],&quot;route&quot;:&quot;Капилляры печени → Печёночная вена → Нижняя полая вена → Правая половина сердца → Капилляры лёгких → Аорта → Капилляры мышц голени.&quot;,&quot;explanation&quot;:&quot;Печень поддерживает концентрацию глюкозы крови, в частности, благодаря распаду запасного гликогена. Глюкоза покидает печень по печёночной вене, проходит сердце и лёгкие и с артериальной кровью достигает работающих мышц. Там она используется для синтеза АТФ.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 37 «Обмен веществ и энергии»; Борисов, 9 кл., § 28 «Кровообращение»; Дашков, 11 кл., § 21 «Клеточное дыхание. Брожение»&quot;},{&quot;id&quot;:48,&quot;category&quot;:&quot;Мышечная Работа&quot;,&quot;question&quot;:&quot;Во время физической нагрузки сердечная мышца стала активнее образовывать углекислый газ. Проследите движение этого газа от капилляров миокарда до капилляров лёгких. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Лёгочные вены&quot;,&quot;Правое предсердие&quot;,&quot;Коронарные вены&quot;,&quot;Правый желудочек&quot;,&quot;Лёгочные артерии&quot;,&quot;Капилляры сердечной мышцы&quot;,&quot;Капилляры лёгких&quot;],&quot;answer&quot;:[5,2,1,3,4,6],&quot;route&quot;:&quot;Капилляры сердечной мышцы → Коронарные вены → Правое предсердие → Правый желудочек → Лёгочные артерии → Капилляры лёгких.&quot;,&quot;explanation&quot;:&quot;Углекислый газ из мышечных клеток сердца поступает в коронарное венозное русло, затем через венозный синус сердца — в правое предсердие. Из правого желудочка кровь направляется к лёгочным капиллярам, где отдаёт углекислый газ. Лёгочные вены отводят уже насыщенную кислородом кровь после газообмена.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 28 «Кровообращение»; Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Дашков, 11 кл., § 21 «Клеточное дыхание. Брожение»&quot;},{&quot;id&quot;:49,&quot;category&quot;:&quot;Мышечная Работа&quot;,&quot;question&quot;:&quot;Во время продолжительной работы мышц плеча часть образовавшейся молочной кислоты переносится с кровью к печени. Установите путь молочной кислоты от капилляров мышц плеча до капилляров печени. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры лёгких&quot;,&quot;Воротная вена печени&quot;,&quot;Нижняя полая вена&quot;,&quot;Капилляры печени&quot;,&quot;Капилляры мышц плеча&quot;,&quot;Подключичная вена&quot;,&quot;Верхняя полая вена&quot;],&quot;answer&quot;:[4,5,6,0,3],&quot;route&quot;:&quot;Капилляры мышц плеча → Подключичная вена → Верхняя полая вена → Капилляры лёгких → Капилляры печени.&quot;,&quot;explanation&quot;:&quot;Во время интенсивной работы мышц может образовываться молочная кислота. По венам верхней конечности продукты её образования достигают верхней полой вены, проходят правую половину сердца, лёгкие и левую половину сердца. Затем с артериальной кровью они направляются к печени. Воротная вена печени приносит кровь от органов пищеварения, а не от мышц плеча.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 20 «Работа мышц»; Борисов, 9 кл., § 28 «Кровообращение»; Дашков, 11 кл., § 21 «Клеточное дыхание. Брожение»&quot;},{&quot;id&quot;:50,&quot;category&quot;:&quot;Мышечная Работа&quot;,&quot;question&quot;:&quot;При учащении дыхания диафрагма выполняет больше работы. Кислород, перешедший из альвеол в кровь, должен достичь капилляров этой дыхательной мышцы. Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&quot;,&quot;options&quot;:[&quot;Капилляры диафрагмы&quot;,&quot;Аорта&quot;,&quot;Капилляры лёгких&quot;,&quot;Лёгочные артерии&quot;,&quot;Правое предсердие&quot;,&quot;Лёгочные вены&quot;,&quot;Правый желудочек&quot;],&quot;answer&quot;:[2,5,1,0],&quot;route&quot;:&quot;Капилляры лёгких → Лёгочные вены → Аорта → Капилляры диафрагмы.&quot;,&quot;explanation&quot;:&quot;Диафрагма — скелетная дыхательная мышца и нуждается в кислороде для синтеза АТФ. После поступления в кровь лёгочных капилляров кислород перемещается по лёгочным венам в левое сердце и из аорты через артериальные ветви к диафрагме. Правые камеры сердца и лёгочные артерии находятся перед лёгочными капиллярами.&quot;,&quot;reference&quot;:&quot;Борисов, 9 кл., § 33 «Газообмен и транспорт газов»; Борисов, 9 кл., § 20 «Работа мышц»; Дашков, 11 кл., § 21 «Клеточное дыхание. Брожение»&quot;}]&lt;/script&gt;
&lt;script&gt;
&#x27;use strict&#x27;;
/* М.И.Р. — Маршрут крови, уровень 4.2. Самостоятельный офлайн-тренажёр. */
const BANK = JSON.parse(document.getElementById(&#x27;bank-data&#x27;).textContent);
const $ = id =&gt; document.getElementById(id);
const esc = s =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const shuffle = xs =&gt; {const a=[...xs];for(let i=a.length-1;i&gt;0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const same = (a,b) =&gt; a.length===b.length &amp;&amp; a.every((x,i)=&gt;x===b[i]);
const state = {mode:&#x27;main&#x27;,queue:[],cursor:0,results:[],selected:[],numberOrder:[],swap:null,errors:[],mainStats:null};
let drag=null,ignoreClicksUntil=0;
const directive=&#x27;Выберите необходимые элементы из предложенного перечня и расположите их в последовательности движения указанного вещества от исходного участка до конечного пункта.&#x27;;
function current(){return state.queue[state.cursor]}
function numberFor(id){return state.numberOrder.indexOf(id)+1}
function byNum(a,b){return numberFor(a)-numberFor(b)}
function startSession(ids,mode){
 state.mode=mode;
 state.queue=shuffle(ids.map(id=&gt;BANK.find(q=&gt;q.id===id)));
 state.cursor=0;state.results=[];state.errors=[];
 if(mode===&#x27;main&#x27;)state.mainStats=null;
 newProblem();
}
function newProblem(){
 state.selected=[];state.swap=null;
 state.numberOrder=shuffle([0,1,2,3,4,5,6]);
 showOnly(&#x27;practice&#x27;);renderPractice();
}
function showOnly(name){
 [&#x27;intro&#x27;,&#x27;practice&#x27;,&#x27;reviewScreen&#x27;,&#x27;finish&#x27;].forEach(x=&gt;$(x).hidden=(x!==name));
 $(&#x27;bottom&#x27;).hidden=![&#x27;practice&#x27;,&#x27;reviewScreen&#x27;].includes(name);
 $(&#x27;stage&#x27;).dataset.view=name;
 $(&#x27;meta&#x27;).textContent=&#x27;Уровень 4.2 · ЭКСТРА&#x27;;
 $(&#x27;progressWrap&#x27;).hidden=(name===&#x27;intro&#x27;);
 updateProgress();
 if(name===&#x27;intro&#x27;)$(&#x27;bottom&#x27;).hidden=true;
}
function updateProgress(){
 const total=state.queue.length||BANK.length;
 const done=state.results.length;
 $(&#x27;progressTop&#x27;).textContent=(state.mode===&#x27;errors&#x27;?&#x27;Работа над ошибками · &#x27;:&#x27;&#x27;)+`Пройдено: ${done} из ${total} · Осталось: ${total-done}`;
 $(&#x27;progressFill&#x27;).style.width=(100*done/total)+&#x27;%&#x27;;
}
function renderPractice(){
 const q=current();
 $(&#x27;heading&#x27;).textContent=&#x27;Маршрут крови&#x27;;$(&#x27;category&#x27;).textContent=q.category;
 $(&#x27;progress&#x27;).textContent=`${state.cursor+1} из ${state.queue.length}`;
 updateProgress();
 let [situ,dir]=q.question.split(directive);
 if(dir===undefined){situ=q.question;dir=&#x27;&#x27;;}else{dir=directive+dir}
 $(&#x27;question&#x27;).innerHTML=&#x27;&lt;span class=&quot;situation&quot;&gt;&#x27;+esc(situ.trim())+&#x27;&lt;/span&gt;&#x27;+(dir?&#x27;&lt;span class=&quot;directive&quot;&gt;&#x27;+esc(dir.trim())+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
 $(&#x27;choiceList&#x27;).innerHTML=state.numberOrder.map((id,i)=&gt;{
  const used=state.selected.includes(id);
  return `&lt;button type=&quot;button&quot; class=&quot;choice ${used?&#x27;is-used&#x27;:&#x27;&#x27;}&quot; data-kind=&quot;choice&quot; data-id=&quot;${id}&quot; aria-label=&quot;Вариант ${i+1}: ${esc(q.options[id])}. ${used?&#x27;Убрать из маршрута&#x27;:&#x27;Добавить в маршрут&#x27;}&quot;&gt;&lt;span class=&quot;num&quot;&gt;${i+1}&lt;/span&gt;&lt;span class=&quot;name&quot;&gt;${esc(q.options[id])}&lt;/span&gt;&lt;/button&gt;`;
 }).join(&#x27;&#x27;);
 const r=[];
 for(let i=0;i&lt;7;i++){
  if(i&gt;=state.selected.length){r.push(&#x27;&lt;div class=&quot;route-empty&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&#x27;);continue}
  const id=state.selected[i];
  r.push(`&lt;div class=&quot;route-item ${state.swap===id?&#x27;tap-selected&#x27;:&#x27;&#x27;}&quot; data-kind=&quot;route&quot; data-id=&quot;${id}&quot; data-pos=&quot;${i}&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;move&quot; data-action=&quot;swap&quot; data-id=&quot;${id}&quot; aria-label=&quot;Поменять местами: ${esc(q.options[id])}&quot;&gt;&lt;span class=&quot;position&quot;&gt;${i+1}.&lt;/span&gt;&lt;span class=&quot;num&quot;&gt;${numberFor(id)}&lt;/span&gt;&lt;span class=&quot;name&quot;&gt;${esc(q.options[id])}&lt;/span&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;remove&quot; data-action=&quot;remove&quot; data-id=&quot;${id}&quot; aria-label=&quot;Убрать элемент ${esc(q.options[id])} из маршрута&quot; title=&quot;Убрать из маршрута&quot;&gt;×&lt;/button&gt;&lt;/div&gt;`);
 }
 $(&#x27;routeList&#x27;).innerHTML=r.join(&#x27;&#x27;);$(&#x27;routeList&#x27;).classList.toggle(&#x27;has-items&#x27;,state.selected.length&gt;0);
 $(&#x27;routeCounter&#x27;).textContent=`Выбрано: ${state.selected.length}`;
 $(&#x27;status&#x27;).textContent=state.swap===null?`В маршруте ${state.selected.length} элементов`:&#x27;Теперь нажмите другую плашку маршрута, чтобы поменять их местами&#x27;;
 $(&#x27;reset&#x27;).hidden=false;$(&#x27;next&#x27;).hidden=true;$(&#x27;check&#x27;).hidden=false;$(&#x27;check&#x27;).disabled=!state.selected.length;
 $(&#x27;hint&#x27;).hidden=false;
 adaptPractice();
}
function adaptPractice(){
 const q=$(&#x27;question&#x27;);const instruction=$(&#x27;hint&#x27;);q.style.fontSize=&#x27;&#x27;;instruction.hidden=false;
 if(window.matchMedia(&#x27;(max-aspect-ratio:4/3)&#x27;).matches){
  if($(&#x27;workarea&#x27;).clientHeight&lt;260){instruction.hidden=true;q.style.fontSize=&#x27;clamp(12px,3vw,17px)&#x27;}
 }
}
function addItem(id,where){
 const old=state.selected.indexOf(id);
 if(old&gt;=0){state.selected.splice(old,1)} else if(where===undefined){state.selected.push(id)} else {state.selected.splice(where,0,id)}
 state.swap=null;renderPractice();
}
function removeItem(id){const i=state.selected.indexOf(id);if(i&gt;=0)state.selected.splice(i,1);state.swap=null;renderPractice()}
function swapItem(id){
 if(state.swap===null){state.swap=id}
 else if(state.swap===id){state.swap=null}
 else {const a=state.selected.indexOf(state.swap),b=state.selected.indexOf(id);if(a!==-1&amp;&amp;b!==-1)[state.selected[a],state.selected[b]]=[state.selected[b],state.selected[a]];state.swap=null}
 renderPractice();
}
function checkAnswer(){
 if(!state.selected.length)return;
 const q=current(),picked=[...state.selected],answer=q.answer;
 const extra=picked.filter(id=&gt;!answer.includes(id));const missing=answer.filter(id=&gt;!picked.includes(id));
 const inPlace=picked.filter((id,i)=&gt;id===answer[i]).length;
 const selectedCorrect=answer.length-missing.length;
 const allCorrect=same(picked,answer);
 const orderError=picked.some((id,i)=&gt;answer.includes(id)&amp;&amp;id!==answer[i]);
 const info={id:q.id,correct:allCorrect,choiceError:!!(extra.length||missing.length),orderError,chosen:[...picked],extra,missing,inPlace,selectedCorrect};
 state.results.push(info);
 if(!info.correct)state.errors.push(q.id);
 renderReview(info);
}
function renderReview(info){
 const q=current(),a=q.answer,p=info.chosen;
 showOnly(&#x27;reviewScreen&#x27;);
 $(&#x27;reviewQuestion&#x27;).textContent=q.question;
 updateProgress();
 $(&#x27;reviewVerdict&#x27;).textContent=info.correct?&#x27;Всё верно!&#x27;:&#x27;Есть ошибки&#x27;;
 $(&#x27;reviewVerdict&#x27;).classList.toggle(&#x27;correct&#x27;,info.correct);
 $(&#x27;reviewSummary&#x27;).textContent=`Верно выбрано необходимых элементов: ${info.selectedCorrect} из ${a.length}. Лишних: ${info.extra.length}. Пропущено: ${info.missing.length}. На правильных местах: ${info.inPlace} из ${a.length}.`;
 $(&#x27;yourCode&#x27;).innerHTML=p.map((id,i)=&gt;`&lt;span class=&quot;digit ${id===a[i]?&#x27;green&#x27;:&#x27;red&#x27;}&quot; title=&quot;${!a.includes(id)?&#x27;Лишний элемент&#x27;:id===a[i]?&#x27;На своём месте&#x27;:&#x27;Неправильная позиция&#x27;}&quot;&gt;${numberFor(id)}&lt;/span&gt;`).join(&#x27;&#x27;);
 $(&#x27;correctCode&#x27;).innerHTML=a.map(id=&gt;`&lt;span class=&quot;digit correct-answer&quot;&gt;${numberFor(id)}&lt;/span&gt;`).join(&#x27;&#x27;);
 const notes=[];
 if(info.extra.length)notes.push(`&lt;span class=&quot;extra&quot;&gt;Лишние элементы: ${info.extra.map(id=&gt;`${numberFor(id)} — ${esc(q.options[id])}`).join(&#x27;; &#x27;)}.&lt;/span&gt;`);
 if(info.missing.length)notes.push(`&lt;span class=&quot;miss&quot;&gt;Пропущены: ${info.missing.map(id=&gt;`${numberFor(id)} — ${esc(q.options[id])}`).join(&#x27;; &#x27;)}.&lt;/span&gt;`);
 if(!info.choiceError&amp;&amp;!info.correct)notes.push(&#x27;Все необходимые элементы выбраны, но их порядок нарушен.&#x27;);
 if(info.correct)notes.push(&#x27;Все необходимые элементы выбраны и расположены в правильном порядке.&#x27;);
 $(&#x27;reviewErrors&#x27;).innerHTML=notes.join(&#x27; &#x27;);
 $(&#x27;correctRoute&#x27;).innerHTML=`&lt;strong&gt;Правильный путь вещества: &lt;/strong&gt;${esc(q.route)}`;
 $(&#x27;explainText&#x27;).textContent=q.explanation;
 $(&#x27;reset&#x27;).hidden=true;$(&#x27;check&#x27;).hidden=true;$(&#x27;next&#x27;).hidden=false;
 $(&#x27;status&#x27;).textContent=`${state.cursor+1} из ${state.queue.length} · ${q.category}`;
 requestAnimationFrame(fitReview);
}
function fitReview(){
 const content=$(&#x27;answerContent&#x27;),p=$(&#x27;explainText&#x27;),route=$(&#x27;correctRoute&#x27;),question=$(&#x27;reviewQuestion&#x27;);p.style.fontSize=&#x27;&#x27;;route.style.fontSize=&#x27;&#x27;;question.style.fontSize=&#x27;&#x27;;
 // Уменьшение применяется лишь при реальном переполнении, а не по длине текста.
 let currentP=parseFloat(getComputedStyle(p).fontSize),currentR=parseFloat(getComputedStyle(route).fontSize);
 const mobile=window.matchMedia(&#x27;(max-aspect-ratio:4/3)&#x27;).matches;
 const minP=mobile?12:16,minR=mobile?13:16;let currentQ=parseFloat(getComputedStyle(question).fontSize);
 for(let i=0;i&lt;18;i++){
  const contentTooTall=content.scrollHeight&gt;content.clientHeight+3;
  const pTooTall=p.getBoundingClientRect().bottom&gt;content.getBoundingClientRect().bottom+3;
  const entireScreenTooTall=$(&#x27;reviewScreen&#x27;).scrollHeight&gt;$(&#x27;reviewScreen&#x27;).clientHeight+3;
  if(!contentTooTall&amp;&amp;!pTooTall&amp;&amp;!entireScreenTooTall)break;
  if(entireScreenTooTall &amp;&amp; currentQ&gt;(mobile?12:15)){currentQ=Math.max(mobile?12:15,currentQ-.5);question.style.fontSize=currentQ+&#x27;px&#x27;}
  if(currentR&gt;minR){currentR=Math.max(minR,currentR-1);route.style.fontSize=currentR+&#x27;px&#x27;}
  if(currentP&gt;minP){currentP=Math.max(minP,currentP-1);p.style.fontSize=currentP+&#x27;px&#x27;}
 }
}
function advance(){
 if(state.cursor+1&lt;state.queue.length){state.cursor++;newProblem()}
 else renderFinish();
}
function renderFinish(){
 showOnly(&#x27;finish&#x27;);
 const n=state.results.length,correct=state.results.filter(x=&gt;x.correct).length,wrong=n-correct;
 const ch=state.results.filter(x=&gt;x.choiceError).length,ord=state.results.filter(x=&gt;x.orderError).length;
 if(state.mode===&#x27;main&#x27;)state.mainStats={n,correct,wrong,ch,ord};
 $(&#x27;finishHeading&#x27;).textContent=state.mode===&#x27;errors&#x27;?&#x27;Работа над ошибками завершена!&#x27;:&#x27;Тренировка завершена!&#x27;;
 $(&#x27;score&#x27;).textContent=`Правильно: ${correct} из ${n}`;
 $(&#x27;subscore&#x27;).textContent=`Заданий с ошибками: ${wrong}. Ошибки при выборе элементов: ${ch}. Ошибки в последовательности: ${ord}.`;
 updateProgress();
 $(&#x27;repeat&#x27;).hidden=wrong===0;
 $(&#x27;repeat&#x27;).disabled=wrong===0;
}
function resetProblem(){state.selected=[];state.swap=null;renderPractice()}
function handleClick(event){
 if(Date.now()&lt;ignoreClicksUntil)return;
 const target=event.target.closest(&#x27;[data-action],[data-kind]&#x27;);if(!target||$(&#x27;practice&#x27;).hidden)return;
 if(target.dataset.action===&#x27;remove&#x27;){removeItem(Number(target.dataset.id));return}
 if(target.dataset.action===&#x27;swap&#x27;){swapItem(Number(target.dataset.id));return}
 if(target.dataset.kind===&#x27;choice&#x27;){addItem(Number(target.dataset.id));return}
}
function startDrag(event){
 if($(&#x27;practice&#x27;).hidden||event.button!==0)return;
 if(event.target.closest(&#x27;.remove&#x27;))return;
 const t=event.target.closest(&#x27;.choice,.route-item&#x27;);if(!t)return;
 drag={from:t.dataset.kind,id:Number(t.dataset.id),startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,active:false,ghost:null};
}
function moveDrag(event){
 if(!drag)return;
 const d=drag;d.x=event.clientX;d.y=event.clientY;
 if(!d.active &amp;&amp; Math.hypot(d.x-d.startX,d.y-d.startY)&gt;9){
  d.active=true;const n=document.createElement(&#x27;div&#x27;);n.className=&#x27;ghost&#x27;;n.textContent=`${numberFor(d.id)}. ${current().options[d.id]}`;document.body.appendChild(n);d.ghost=n;
 }
 if(d.active){
  event.preventDefault();d.ghost.style.left=d.x+&#x27;px&#x27;;d.ghost.style.top=d.y+&#x27;px&#x27;;
  document.querySelectorAll(&#x27;.drop-target&#x27;).forEach(x=&gt;x.classList.remove(&#x27;drop-target&#x27;));
  const target=document.elementFromPoint(d.x,d.y)?.closest(&#x27;.choice,.route-item,#routeList,#choiceList&#x27;);
  if(target)target.classList.add(&#x27;drop-target&#x27;);
 }
}
function endDrag(event){
 if(!drag)return;
 const d=drag;drag=null;if(d.ghost)d.ghost.remove();
 document.querySelectorAll(&#x27;.drop-target&#x27;).forEach(x=&gt;x.classList.remove(&#x27;drop-target&#x27;));
 if(!d.active)return;
 ignoreClicksUntil=Date.now()+350;
 const target=document.elementFromPoint(d.x,d.y)?.closest(&#x27;.choice,.route-item,#routeList,#choiceList&#x27;);
 if(!target)return;
 if(target.matches(&#x27;#choiceList,.choice&#x27;)){if(d.from===&#x27;route&#x27;)removeItem(d.id);else if(!state.selected.includes(d.id))addItem(d.id);return}
 if(target.matches(&#x27;#routeList,.route-item&#x27;)){
  if(d.from===&#x27;choice&#x27;&amp;&amp;state.selected.includes(d.id))return;
  const to=target.matches(&#x27;.route-item&#x27;)?Number(target.dataset.pos):state.selected.length;
  const fresh=state.selected.filter(x=&gt;x!==d.id);
  fresh.splice(Math.min(to,fresh.length),0,d.id);state.selected=fresh;state.swap=null;renderPractice();
 }
}
function onKeydown(event){
 if($(&#x27;practice&#x27;).hidden)return;
 const t=event.target.closest(&#x27;[data-action=&quot;swap&quot;]&#x27;);if(!t||![&#x27;ArrowUp&#x27;,&#x27;ArrowDown&#x27;,&#x27;ArrowLeft&#x27;,&#x27;ArrowRight&#x27;].includes(event.key))return;
 const id=Number(t.dataset.id),i=state.selected.indexOf(id),step=(event.key===&#x27;ArrowUp&#x27;||event.key===&#x27;ArrowLeft&#x27;)?-1:1,j=i+step;
 if(j&lt;0||j&gt;=state.selected.length)return;
 event.preventDefault();[state.selected[i],state.selected[j]]=[state.selected[j],state.selected[i]];renderPractice();
 const b=document.querySelector(`[data-action=&quot;swap&quot;][data-id=&quot;${id}&quot;]`);b?.focus();
}
